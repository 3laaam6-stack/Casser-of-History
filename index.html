    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
    @keyframes bounceIn { 0%{opacity:0;transform:scale(0.3);} 50%{opacity:1;transform:scale(1.05);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes notificationOut { 0%{opacity:1;max-height:100px;margin-bottom:6px;} 100%{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;} }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
    @keyframes glow { 0%,100%{box-shadow:0 0 5px rgba(99,102,241,0.3);} 50%{box-shadow:0 0 20px rgba(99,102,241,0.6);} }

    .animate-fadeInUp { animation: fadeInUp 0.5s ease-out; }
    .animate-fadeInDown { animation: fadeInDown 0.5s ease-out; }
    .animate-scaleIn { animation: scaleIn 0.4s ease-out; }
    .animate-bounceIn { animation: bounceIn 0.6s ease-out; }
    .animate-slideDown { animation: slideDown 0.4s ease-out; }

    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .animate-shake { animation: shake 0.5s ease-in-out; }
    .animate-notificationOut { animation: notificationOut 0.5s ease-in forwards; }

    .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; } .stagger-3 { animation-delay: 0.15s; }

    .app-container { display: flex; min-height: 100vh; }

    .sidebar {

    .btn { padding: 8px 15px; margin: 2px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; transition: all 0.3s; }

    .filter-bar select { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: #fff; transition: all 0.3s; }

    .schedule-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    .schedule-table th { background: var(--primary); color: #fff; padding: 14px; font-size: 16px; }
    .schedule-table td { padding: 10px; text-align: center; border: 1px solid var(--border); vertical-align: top; min-height: 90px; }
    .schedule-table td strong { display: block; margin-bottom: 8px; color: var(--primary); }
    .schedule-table td .schedule-item { background: #f1f5f9; padding: 8px 10px; border-radius: 8px; margin: 4px 0; font-size: 13px; text-align: right; position: relative; }
    .schedule-table td .schedule-item .si-time { font-weight: 700; color: var(--primary); }
    .schedule-table td .schedule-item .si-group { color: var(--text); }
    .schedule-table td .schedule-item .si-subject { color: var(--text-light); font-size: 11px; }
    .schedule-table td .schedule-item .si-delete { position: absolute; left: 6px; top: 6px; cursor: pointer; font-size: 14px; opacity: 0.5; transition: 0.2s; }

    .schedule-form-card { background: var(--card); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 22px; }

    /* ========== STORE ========== */
    .store-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
    .store-stage-card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); border: 2px solid var(--border); transition: 0.35s; min-height: 320px; display: flex; flex-direction: column; }
    .store-stage-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-4px); }
    .store-stage-card .stage-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 3px solid var(--primary); }
    .store-stage-card .stage-header .stage-title { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .store-stage-card .stage-header .stage-count { background: var(--bg); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-light); }
    .store-stage-card .stage-files { flex: 1; overflow-y: auto; max-height: 350px; margin-bottom: 12px; }
    .store-stage-card .stage-files::-webkit-scrollbar { width: 4px; }
    .store-stage-card .stage-files::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    .store-file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; transition: 0.2s; gap: 8px; }
    .store-file-item:hover { background: #e2e8f0; }
    .store-file-item .file-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .store-file-item .file-info .file-icon-small { font-size: 20px; flex-shrink: 0; }
    .store-file-item .file-info .file-name-text { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .store-file-item .file-actions-mini { display: flex; gap: 4px; flex-shrink: 0; }
    .store-file-item .file-actions-mini button { padding: 4px 8px; font-size: 11px; border-radius: 6px; }
    .upload-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.3s; }
    .upload-btn:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(99,102,241,0.3); }

    /* ========== HALL OF FAME ========== */
    .hall-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

    .qr-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeInUp 0.3s; }

    .qr-modal-content h3 { margin-bottom: 15px; color: #1e293b; }
    .qr-modal-content canvas { margin: 0 auto; display: block; }
    .qr-modal-content button { margin-top: 15px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 700; z-index: 9999; animation: slideDown 0.3s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

    @media (max-width: 1200px) { .store-grid, .hall-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 1024px) { :root { --sidebar-w: 300px; } .stats-row { grid-template-columns: repeat(3, 1fr); } .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .app-container { flex-direction: column; } .sidebar { position: relative; width: 100%; min-width: 100%; padding: 16px; } .content { margin-right: 0; padding: 14px; } .stats-row, .grid { grid-template-columns: repeat(2, 1fr); } .store-grid, .hall-grid { grid-template-columns: 1fr; } }

<div class="app-container">

      <button onclick="navigateTo('students')"><span class="nav-icon">👨‍🎓</span> الطلاب</button>

<script>
// ==================== DATA LAYER ====================
const PF = 'caeser_';
function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function get(k) { return JSON.parse(localStorage.getItem(PF + k) || '[]'); }
function set(k, v) { localStorage.setItem(PF + k, JSON.stringify(v)); }
const students = () => get('students'), saveStudents = (v) => set('students', v), studentById = (id) => students().find(s => s.id === id);
const groups = () => get('groups'), saveGroups = (v) => set('groups', v), groupById = (id) => groups().find(g => g.id === id);
const attendance = () => get('attendance'), saveAttendance = (v) => set('attendance', v);
const payments = () => get('payments'), savePayments = (v) => set('payments', v);
const exams = () => get('exams'), saveExams = (v) => set('exams', v);
const storeFiles = () => get('store'), saveStore = (v) => set('store', v);
const activityLog = () => get('activity'), saveActivity = (v) => set('activity', v);
const notifications = () => get('notifications'), saveNotifications = (v) => set('notifications', v);
const schedule = () => get('schedule'), saveSchedule = (v) => set('schedule', v);

const DAYS = ['الجمعة', 'السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
if (!localStorage.getItem(PF + 'schedule')) { const init = {}; DAYS.forEach(d => init[d] = []); saveSchedule(init); }

function fileToBase64(file) { return new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); }); }

function addNotification(msg) { const n = notifications(); n.push({ id: gid(), msg, seen: false, time: Date.now() }); saveNotifications(n); }
function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => { t.style.animation = 'slideDown 0.3s ease-out reverse'; setTimeout(() => t.remove(), 300); }, 2000); }

function dismissNotification(id, element) { element.classList.add('dismissing'); setTimeout(() => { const n = notifications(); const idx = n.findIndex(x => x.id === id); if (idx > -1) { n[idx].seen = true; saveNotifications(n); } if (element.parentNode) element.remove(); }, 400); }

// ==================== QR CODE ====================
function generateQR(text, elementId) { const el = document.getElementById(elementId); if (!el) return; el.innerHTML = ''; const size = 200, canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size); const mc = 21, ms = size / mc; function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash); } const hash = hashCode(text); const rng = (seed) => { let s = seed; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s % 2 === 0; }; }; const random = rng(hash); ctx.fillStyle = '#000000'; for (let row = 0; row < mc; row++) { for (let col = 0; col < mc; col++) { if ((row < 7 && col < 7) || (row < 7 && col > mc - 8) || (row > mc - 8 && col < 7)) { if ((row === 0 || row === 6 || col === 0 || col === 6) || (row >= 2 && row <= 4 && col >= 2 && col <= 4)) ctx.fillRect(col * ms, row * ms, ms, ms); } else if (random()) ctx.fillRect(col * ms, row * ms, ms, ms); } } el.appendChild(canvas); }
function showQR(id) { const s = studentById(id); if (!s) return; const existing = document.querySelector('.qr-modal'); if (existing) existing.remove(); const modal = document.createElement('div'); modal.className = 'qr-modal'; modal.innerHTML = `<div class="qr-modal-content"><h3>📱 ${s.name}</h3><div id="qr-container"></div><p style="margin:10px 0;">📞 ${s.phone}</p><button class="btn btn-back" onclick="this.closest('.qr-modal').remove()">❌ إغلاق</button></div>`; document.body.appendChild(modal); setTimeout(() => generateQR(`الطالب: ${s.name}\nالهاتف: ${s.phone}`, 'qr-container'), 100); }
function sendTemplate(template, studentId) { const s = studentById(studentId); if (!s) return; const templates = { reminder: '📚 تذكير: موعد الحصة غداً إن شاء الله.', exam: '📝 نتيجة امتحانك جاهزة.', payment: '💰 تذكير بدفع الرسوم.', thanks: '🌟 شكراً على اجتهادك!' }; window.open('https://wa.me/' + s.phone.replace(/[^0-9]/g,'') + '?text=' + encodeURIComponent(templates[template] || ''), '_blank'); showToast('✅ تم فتح واتساب'); }

// ==================== SCHEDULE ====================
function addScheduleItem() {
  const day = prompt('اختر اليوم:\n' + DAYS.map((d,i) => (i+1)+'- '+d).join('\n'), '1');
  if (!day) return;
  const di = parseInt(day) - 1;
  if (di < 0 || di >= DAYS.length) return alert('رقم غير صحيح');
  const dayName = DAYS[di];
  const time = prompt('الوقت (مثال: 5:00 مساءً):', '');
  if (time === null) return;
  const group = prompt('المجموعة:', '');
  if (group === null) return;
  const subject = prompt('المادة:', 'تاريخ');
  if (subject === null) return;
  const sch = schedule();
  if (!sch[dayName]) sch[dayName] = [];
  sch[dayName].push({ time, group, subject: subject || 'تاريخ' });
  saveSchedule(sch);
  showToast('✅ تمت إضافة الحصة');
  loadDashboard();
}

function deleteScheduleItem(day, index) {
  const sch = schedule();
  if (sch[day]) { sch[day].splice(index, 1); saveSchedule(sch); showToast('🗑️ تم حذف الحصة'); loadDashboard(); }
}

async function exportScheduleImage() {
  const el = document.getElementById('schedule-container');

  try {

    const link = document.createElement('a');
    link.download = 'schedule_' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ تم تصدير الجدول كصورة');
  } catch(e) { alert('فشل التصدير'); }
}

function filterStudentList() {
  let list = students();
  const g = document.getElementById('filterGroup')?.value, p = document.getElementById('filterPayment')?.value, a = document.getElementById('filterAttendance')?.value;
  if (g) list = list.filter(s => s.groupId === g);
  if (p === 'paid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length > 0);
  if (p === 'unpaid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length === 0);
  if (a === 'high') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length && (att.filter(x=>x.status==='present').length/att.length) >= 0.7; });
  if (a === 'low') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length === 0 || (att.filter(x=>x.status==='present').length/att.length) < 0.7; });
  const q = document.getElementById('ss')?.value.toLowerCase();
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.phone.includes(q));
  return list;
}

function renderStudentTable(list) {
  const gr = groups(), tbody = document.getElementById('stb');
  if (!tbody) return;
  tbody.innerHTML = list.map((s, i) => { const g = gr.find(x => x.id === s.groupId); return `<tr class="animate-fadeInUp" style="animation-delay:${i*0.03}s"><td><strong>${s.name}</strong></td><td>${s.phone}</td><td>${g?g.name:'—'}</td><td><span class="points">⭐ ${s.points||0}</span></td><td><button class="btn btn-qr" onclick="showQR('${s.id}')">📱</button></td><td><button class="btn btn-template" onclick="showTemplates('${s.id}')">📋</button></td><td><button class="btn btn-share" onclick="shareStudent('${s.id}')">📤</button></td><td><button class="btn btn-view" onclick="viewStudent('${s.id}')">👁️</button><button class="btn btn-edit" onclick="editStudent('${s.id}')">✏️</button><button class="btn btn-del" onclick="deleteStudentFull('${s.id}')">🗑️</button></td></tr>`; }).join('');
}

function showTemplates(id) { const t = prompt('1- تذكير\n2- نتيجة\n3- دفع\n4- شكر', '1'); const map = { '1': 'reminder', '2': 'exam', '3': 'payment', '4': 'thanks' }; if (map[t]) sendTemplate(map[t], id); }

function shareStudent(id) {
  const s = studentById(id); if (!s) return;
  const g = groupById(s.groupId), att = attendance().filter(a => a.studentId === s.id);
  const pay = payments().filter(p => p.studentId === s.id), ex = exams().filter(e => e.studentId === s.id);
  const tot = pay.reduce((sm,p) => sm + p.amount, 0), pres = att.filter(a => a.status === 'present').length;
  const pct = att.length ? Math.round((pres/att.length)*100) : 0, avg = ex.length ? (ex.reduce((sm,e)=>sm+e.score,0)/ex.length).toFixed(1) : 0;
  shareText(`📋 ${s.name}\n📞 ${s.phone}\n👥 ${g?g.name:'—'}\n📊 حضور: ${pct}%\n💰 مدفوعات: ${tot} ج.م\n📝 متوسط: ${avg}\n⭐ نقاط: ${s.points||0}\n---\nCaeser of History`);

function loadAttendance() {
  const m = document.getElementById('main-content'), gr = groups();

    <div style="display:flex;gap:12px;margin-bottom:20px;">

    </div>
    <div id="attf"></div>
    <h3 style="margin-top:24px;">📅 سجل الحضور السابق</h3>

  </div>`;

function showAttendance() {
  const groupId = document.getElementById('ag').value;
  const date = document.getElementById('ad').value;
  if (!groupId || !date) return alert('اختر المجموعة والتاريخ');

  const st = students().filter(s => s.groupId === groupId);
  if (!st.length) return (document.getElementById('attf').innerHTML = '<p>لا يوجد طلاب في هذه المجموعة</p>');

  const existingRecords = attendance().filter(a => a.groupId === groupId && a.date === date);
  const statusMap = {};
  existingRecords.forEach(a => (statusMap[a.studentId] = a.status));

  let formHtml = '<form id="saf"><table><thead><tr><th>الطالب</th><th>حاضر</th><th>غائب</th></tr></thead><tbody>';
  st.forEach((s, i) => {
    const checkedPresent = statusMap[s.id] !== 'absent' ? 'checked' : '';
    const checkedAbsent = statusMap[s.id] === 'absent' ? 'checked' : '';
    formHtml += `<tr class="animate-fadeInUp" style="animation-delay:${i*0.03}s">
      <td>${s.name}</td>
      <td><input type="radio" name="a-${s.id}" value="present" ${checkedPresent}></td>
      <td><input type="radio" name="a-${s.id}" value="absent" ${checkedAbsent}></td>
    </tr>`;
  });
  formHtml += '</tbody></table><div class="act-bar"><button type="submit" class="btn btn-save">💾 حفظ الحضور</button></div></form>';

  document.getElementById('attf').innerHTML = formHtml;

  document.getElementById('saf').onsubmit = function(e) {
    e.preventDefault();
    let allRecords = attendance().filter(a => !(a.groupId === groupId && a.date === date));

    st.forEach(s => {
      const radio = document.querySelector(`input[name="a-${s.id}"]:checked`);
      if (radio) {
        allRecords.push({
          id: gid(),
          studentId: s.id,
          groupId: groupId,
          date: date,
          status: radio.value
        });
      }
    });

    saveAttendance(allRecords);
    addNotification('📋 تم تسجيل الحضور');
    showToast('✅ تم حفظ الحضور');
    loadAttendance();
  };
}

function renderAttHistory() {
  const all = attendance();
  const container = document.getElementById('atth');
  if (!container) return;

  if (!all.length) return (container.innerHTML = '<p>لا يوجد سجل حضور بعد</p>');

  const grouped = {};
  all.forEach(a => {
    const key = a.date + '_' + a.groupId;
    if (!grouped[key]) grouped[key] = { date: a.date, groupId: a.groupId, present: 0, absent: 0 };
    a.status === 'present' ? grouped[key].present++ : grouped[key].absent++;
  });

  let tableHtml = '<table><thead><tr><th>التاريخ</th><th>المجموعة</th><th>حضور</th><th>غياب</th></tr></thead><tbody>';
  Object.values(grouped).forEach(r => {
    const g = groupById(r.groupId);
    tableHtml += `<tr><td>${r.date}</td><td>${g ? g.name : '—'}</td><td>${r.present}</td><td>${r.absent}</td></tr>`;
  });
  tableHtml += '</tbody></table>';
  container.innerHTML = tableHtml;
}

const STAGES = ['J4', 'J5', 'J6', 'M1', 'M2', 'M3', 'S1', 'S2', 'S3'];
const STAGE_ICONS = {
  'J4': '🎒', 'J5': '📚', 'J6': '✏️',
  'M1': '🔬', 'M2': '📐', 'M3': '🧮',
  'S1': '📖', 'S2': '📝', 'S3': '🎓'
};
const STAGE_COLORS = {
  'J4': '#3b82f6', 'J5': '#10b981', 'J6': '#f59e0b',
  'M1': '#ef4444', 'M2': '#8b5cf6', 'M3': '#ec4899',
  'S1': '#6366f1', 'S2': '#14b8a6', 'S3': '#f97316'
};

// دالة الرفع العامة - موجودة في window عشان تقدر تستدعيها من أي onclick
window.uploadToStage = async function(stage) {
  // إنشاء input file مؤقت
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.gif';
  input.multiple = true;

  input.onchange = async function() {
    if (!this.files.length) return;

    const newFiles = [...storeFiles()];
    let uploadedCount = 0;

    for (const file of this.files) {
      if (file.size > 10 * 1024 * 1024) {
        alert('الملف ' + file.name + ' كبير جداً (أكثر من 10 ميجا)');
        continue;
      }

      const ext = file.name.split('.').pop().toLowerCase();
      const type = ext === 'pdf' ? 'pdf' :
        ['doc', 'docx'].includes(ext) ? 'doc' :
        ['ppt', 'pptx'].includes(ext) ? 'ppt' : 'image';

      try {
        const base64Data = await fileToBase64(file);
        newFiles.push({
          id: gid(),
          name: file.name,
          type: type,
          stage: stage,
          date: new Date().toISOString().slice(0, 10),
          data: base64Data
        });
        uploadedCount++;
      } catch (err) {
        alert('فشل رفع: ' + file.name);
      }
    }

    if (uploadedCount > 0) {
      saveStore(newFiles);
      addNotification('🗄️ ' + uploadedCount + ' ملفات جديدة في ' + stage);
      showToast('✅ تم رفع ' + uploadedCount + ' ملفات لـ ' + stage);
      loadStore();
    }

    // تنظيف الـ input
    this.value = '';
  };

  input.click();
};

function loadStore() {
  const m = document.getElementById('main-content');
  const files = storeFiles();

  let h = `<div class="page"><h2>🗄️ المخزن التعليمي</h2>
    <p style="color:var(--text-light);margin-bottom:20px;">الملفات مرتبة حسب المراحل الدراسية - اضغط على ✏️ لتعديل اسم أي ملف</p>
    <div class="store-grid">`;

  STAGES.forEach((stage, idx) => {
    const stageFiles = files.filter(f => f.stage === stage);
    const color = STAGE_COLORS[stage];

    h += `
    <div class="store-stage-card animate-scaleIn" style="animation-delay:${idx * 0.06}s; border-top: 5px solid ${color};">
      <div class="stage-header" style="border-bottom-color: ${color};">
        <div class="stage-title">
          <span>${STAGE_ICONS[stage]}</span>
          <span style="color:${color};">${stage}</span>
        </div>
        <div class="stage-count">${stageFiles.length} ملفات</div>
      </div>
      <div class="stage-files">`;

    if (stageFiles.length === 0) {
      h += `<div style="text-align:center;color:#94a3b8;padding:20px;">لا توجد ملفات</div>`;
    } else {
      stageFiles.forEach(f => {
        const icon = f.type === 'pdf' ? '📄' : f.type === 'doc' ? '📝' : f.type === 'ppt' ? '📊' : '🖼️';
        h += `
        <div class="store-file-item">
          <div class="file-info">
            <span class="file-icon-small">${icon}</span>
            <span class="file-name-text" title="${f.name}">${f.name}</span>
          </div>
          <div class="file-actions-mini">
            <button class="btn btn-rename" onclick="renameFile('${f.id}')" title="تعديل الاسم">✏️</button>
            <a href="${f.data}" download="${f.name}" class="btn btn-download" title="تحميل">📥</a>
            <button class="btn btn-wa" onclick="shareFile('${f.id}')" title="واتساب">📱</button>

      });

    h += `</div>
      <div class="stage-upload">
        <button class="upload-btn" onclick="uploadToStage('${stage}')">
          ⬆️ رفع ملفات ${stage}
        </button>
      </div>
    </div>`;
  });

  h += `</div></div>`;
  m.innerHTML = h;
}

// ==================== HALL OF FAME PAGE ====================
function loadHalloffame() {
  const m = document.getElementById('main-content');
  const st = students();
  const att = attendance();
  const ex = exams();

  const ranked = st.map(s => {
    const studentAtt = att.filter(x => x.studentId === s.id);
    const presentCount = studentAtt.filter(x => x.status === 'present').length;
    const attPct = studentAtt.length ? Math.round((presentCount / studentAtt.length) * 100) : 0;

    const studentExams = ex.filter(x => x.studentId === s.id);
    const avgScore = studentExams.length
      ? (studentExams.reduce((sum, e) => sum + e.score, 0) / studentExams.length).toFixed(1)
      : 0;

    return { ...s, attendancePct: attPct, avgScore: parseFloat(avgScore) || 0 };
  });

  const byAttendance = [...ranked].sort((a, b) => b.attendancePct - a.attendancePct).slice(0, 5);
  const byScore = [...ranked].sort((a, b) => b.avgScore - a.avgScore).slice(0, 5);
  const byPoints = [...st].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 5);

  let h = `<div class="page"><h2>🏆 لوحة الشرف</h2>`;

  h += `<h3 style="margin-bottom:14px;">📋 أفضل حضور</h3><div class="hall-grid">`;
  byAttendance.forEach((s, i) => {
    h += `<div class="hall-card animate-scaleIn" style="animation-delay:${i * 0.1}s">
      <div class="rank rank-${i + 1}">#${i + 1}</div>
      <div class="name">${s.name}</div>
      <div class="stat">📊 ${s.attendancePct}% حضور</div>
    </div>`;
  });
  h += `</div>`;

  h += `<h3 style="margin:24px 0 14px;">📝 أفضل الدرجات</h3><div class="hall-grid">`;
  byScore.forEach((s, i) => {
    h += `<div class="hall-card animate-scaleIn" style="animation-delay:${i * 0.1}s">
      <div class="rank rank-${i + 1}">#${i + 1}</div>
      <div class="name">${s.name}</div>
      <div class="stat">📝 ${s.avgScore} متوسط</div>
    </div>`;
  });
  h += `</div>`;

  h += `<h3 style="margin:24px 0 14px;">⭐ أكثر نقاط</h3><div class="hall-grid">`;
  byPoints.forEach((s, i) => {
    h += `<div class="hall-card animate-scaleIn" style="animation-delay:${i * 0.1}s">
      <div class="rank rank-${i + 1}">#${i + 1}</div>
      <div class="name">${s.name}</div>
      <div class="stat">⭐ ${s.points || 0} نقطة</div>
    </div>`;
  });
  h += `</div>`;

  h += `</div>`;
  m.innerHTML = h;
}

    const presentCount = studentAtt.filter(x => x.status === 'present').length;
    const attPct = studentAtt.length ? Math.round((presentCount / studentAtt.length) * 100) : 0;
    const totalPaid = pay.filter(x => x.studentId === s.id).reduce((sum, p) => sum + p.amount, 0);
    const studentExams = ex.filter(x => x.studentId === s.id);
    const avgScore = studentExams.length
      ? (studentExams.reduce((sum, e) => sum + e.score, 0) / studentExams.length).toFixed(1)
      : 0;

    h += `<tr class="animate-fadeInUp" style="animation-delay:${i*0.02}s">
      <td>${s.name}</td>
      <td>${g ? g.name : '—'}</td>
      <td>${attPct}%</td>
      <td>${totalPaid} ج.م</td>
      <td>${avgScore}</td>
      <td><span class="points">⭐ ${s.points || 0}</span></td>
    </tr>`;
  });

  h += `</tbody></table>`;

  h += `<h3 style="margin-top:22px;">👥 ملخص المجموعات</h3>
    <table>
      <thead><tr><th>المجموعة</th><th>عدد الطلاب</th><th>متوسط الحضور</th></tr></thead>
      <tbody>`;

  gr.forEach((g, i) => {
    const groupStudents = st.filter(s => s.groupId === g.id);
    if (!groupStudents.length) return;

    let totalAttPct = 0;
    groupStudents.forEach(s => {
      const studentAtt = att.filter(x => x.studentId === s.id);
      const presentCount = studentAtt.filter(x => x.status === 'present').length;
      totalAttPct += studentAtt.length ? (presentCount / studentAtt.length) * 100 : 0;
    });

    const avgAtt = (totalAttPct / groupStudents.length).toFixed(1);
    h += `<tr class="animate-fadeInUp" style="animation-delay:${i*0.03}s">
      <td>${g.name}</td>
      <td>${groupStudents.length} طالب</td>
      <td>${avgAtt}%</td>
    </tr>`;
  });

  h += `</tbody></table></div>`;
  m.innerHTML = h;
}

function exportToExcel() {
  const st = students();
  const att = attendance();
  const pay = payments();
  const ex = exams();

  const data = [['الاسم', 'الهاتف', 'المجموعة', 'حضور%', 'مدفوعات (ج.م)', 'متوسط الدرجات', 'النقاط']];

  st.forEach(s => {
    const g = groupById(s.groupId);
    const studentAtt = att.filter(x => x.studentId === s.id);
    const presentCount = studentAtt.filter(x => x.status === 'present').length;
    const attPct = studentAtt.length ? Math.round((presentCount / studentAtt.length) * 100) : 0;
    const totalPaid = pay.filter(x => x.studentId === s.id).reduce((sum, p) => sum + p.amount, 0);
    const studentExams = ex.filter(x => x.studentId === s.id);
    const avgScore = studentExams.length
      ? (studentExams.reduce((sum, e) => sum + e.score, 0) / studentExams.length).toFixed(1)
      : 0;

    data.push([s.name, s.phone, g ? g.name : '—', attPct + '%', totalPaid, avgScore, s.points || 0]);
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
  XLSX.writeFile(wb, 'Caeser_Students_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  showToast('✅ تم تصدير ملف Excel');
}
