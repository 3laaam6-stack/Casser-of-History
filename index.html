<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caeser of History</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --shadow: 0 4px 15px rgba(0,0,0,0.06);
      --shadow-lg: 0 15px 40px rgba(0,0,0,0.12);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .animate-in { animation: fadeInUp 0.5s ease-out; }
    .animate-slide { animation: slideInLeft 0.4s ease-out; }
    .animate-card { animation: fadeInUp 0.5s ease-out; }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .stagger-6 { animation-delay: 0.6s; }

    .app-container { display: flex; min-height: 100vh; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 290px;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #fff;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      box-shadow: 6px 0 35px rgba(0,0,0,0.35);
      overflow-y: auto;
      transition: all 0.3s ease;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .sidebar .logo {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(255,255,255,0.08);
      animation: float 3s ease-in-out infinite;
    }
    .sidebar .logo .sicon { font-size: 55px; display: block; margin-bottom: 8px; }
    .sidebar .logo h2 { font-size: 24px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin: 6px 0; }
    .sidebar .logo p { font-size: 13px; color: #94a3b8; letter-spacing: 0.5px; }

    .sidebar nav { flex: 1; }
    .sidebar nav .nav-section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 1.5px;
      padding: 0 14px;
      margin: 18px 0 8px;
      font-weight: 700;
    }
    .sidebar nav button {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      background: none;
      border: none;
      color: #cbd5e1;
      padding: 15px 16px;
      font-size: 17px;
      cursor: pointer;
      border-radius: 14px;
      margin-bottom: 4px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }
    .sidebar nav button:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
      transform: translateX(-6px);
    }
    .sidebar nav button.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
    }
    .sidebar nav button.active::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }
    .sidebar nav button .nav-icon { font-size: 24px; width: 36px; text-align: center; transition: transform 0.3s; }
    .sidebar nav button:hover .nav-icon { transform: scale(1.15); }

    .sidebar .bottom {
      margin-top: auto;
      padding-top: 18px;
      border-top: 2px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar .bottom button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .sidebar .bottom button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .btn-ex { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-im { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

    /* ========== CONTENT ========== */
    .content {
      flex: 1;
      margin-right: 290px;
      padding: 30px;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    /* ========== DASHBOARD ========== */
    .dash-header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
      color: #fff;
      padding: 35px 30px;
      border-radius: var(--radius);
      margin-bottom: 28px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out;
    }
    .dash-header::after {
      content: '';
      position: absolute;
      top: -80px;
      left: -80px;
      width: 280px;
      height: 280px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      animation: pulse 4s infinite;
    }
    .dash-header h1 { font-size: 32px; margin-bottom: 6px; position: relative; z-index: 1; font-weight: 800; }
    .dash-header p { font-size: 16px; opacity: 0.9; position: relative; z-index: 1; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      padding: 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.3s;
      cursor: default;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .stat-card .sicon {
      font-size: 40px;
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sicon.blue { background: #dbeafe; } .sicon.green { background: #d1fae5; }
    .sicon.orange { background: #fef3c7; } .sicon.purple { background: #ede9fe; }
    .stat-card .sval { font-size: 30px; font-weight: 800; }
    .stat-card .slbl { font-size: 14px; color: var(--text-light); margin-top: 2px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 18px;
    }
    .dash-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-top: 5px solid var(--primary);
      position: relative;
      overflow: hidden;
    }
    .dash-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-top-color: #8b5cf6;
    }
    .dash-card:hover .ico { animation: pulse 0.6s ease-out; }
    .dash-card .ico { font-size: 50px; display: block; margin-bottom: 12px; transition: transform 0.3s; }
    .dash-card .ttl { font-weight: 800; font-size: 17px; margin-bottom: 4px; }
    .dash-card .sub { font-size: 13px; color: var(--text-light); }

    /* ========== PAGE STYLES ========== */
    .page {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      animation: fadeInUp 0.5s ease-out;
    }
    .page h2 { margin-bottom: 22px; font-size: 26px; display: flex; align-items: center; gap: 12px; }
    .search { margin-bottom: 18px; }
    .search input {
      padding: 13px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      width: 280px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      transition: all 0.3s;
    }
    .search input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      background: var(--bg);
      padding: 18px;
      border-radius: 14px;
      align-items: flex-end;
    }
    form input, form select {
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      transition: all 0.3s;
    }
    form input:focus, form select:focus { border-color: var(--primary); outline: none; }
    form button {
      padding: 12px 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    form button:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(99,102,241,0.3); }
    .file-upload-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-light);
      transition: all 0.3s;
    }
    .file-upload-label:hover { border-color: var(--primary); color: var(--primary); }
    input[type="file"] { display: none; }

    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th {
      background: linear-gradient(180deg, #f8fafc, #f1f5f9);
      padding: 15px 10px;
      font-weight: 700;
      border-bottom: 3px solid var(--primary);
      font-size: 15px;
    }
    td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: 14px;
      transition: background 0.2s;
    }
    tr:hover td { background: #f8fafc; }

    .btn {
      padding: 7px 14px;
      margin: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.3s;
    }
    .btn:hover { transform: scale(1.08); }
    .btn-edit { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-del { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-view { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); }
    .btn-save { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-back { background: linear-gradient(135deg, #64748b, #475569); }
    .btn-download { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

    .alert {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      padding: 15px;
      border-radius: 12px;
      margin: 16px 0;
      color: #92400e;
      font-weight: 600;
      border-right: 4px solid #f59e0b;
    }
    .chart-wrap {
      background: var(--card);
      padding: 22px;
      border-radius: var(--radius);
      margin: 20px 0;
      box-shadow: var(--shadow);
    }
    canvas { max-width: 100%; }
    .act-bar { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .file-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .file-link:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { position: relative; width: 100%; padding: 18px; }
      .content { margin-right: 0; padding: 18px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo">
      <span class="sicon">📜</span>
      <h2>Caeser of History</h2>
      <p>إدارة المجموعات التعليمية</p>
    </div>
    <nav>
      <button class="active" onclick="navigateTo('dashboard')"><span class="nav-icon">🏠</span> الرئيسية</button>
      <button onclick="navigateTo('students')"><span class="nav-icon">👨‍🎓</span> الطلاب</button>
      <button onclick="navigateTo('groups')"><span class="nav-icon">👥</span> المجموعات</button>
      <button onclick="navigateTo('attendance')"><span class="nav-icon">📋</span> الحضور</button>
      <button onclick="navigateTo('payments')"><span class="nav-icon">💰</span> المدفوعات</button>
      <button onclick="navigateTo('exams')"><span class="nav-icon">📝</span> الامتحانات</button>
      <button onclick="navigateTo('reports')"><span class="nav-icon">📊</span> التقارير</button>
    </nav>
    <div class="bottom">
      <button class="btn-ex" onclick="exportAllData()">💾 تصدير البيانات</button>
      <button class="btn-im" onclick="document.getElementById('ifile').click()">📂 استيراد البيانات</button>
      <input type="file" id="ifile" accept=".json" style="display:none" onchange="importAllData(event)">
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content" class="content"></main>
</div>

<script>
  // ==================== DATA ====================
  function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
  function get(key) { const d = localStorage.getItem('caeser_' + key); return d ? JSON.parse(d) : []; }
  function set(key, v) { localStorage.setItem('caeser_' + key, JSON.stringify(v)); }
  const students = () => get('students'), saveStudents = (v) => set('students', v), studentById = (id) => students().find(s => s.id === id);
  const groups = () => get('groups'), saveGroups = (v) => set('groups', v), groupById = (id) => groups().find(g => g.id === id);
  const attendance = () => get('attendance'), saveAttendance = (v) => set('attendance', v);
  const payments = () => get('payments'), savePayments = (v) => set('payments', v);
  const exams = () => get('exams'), saveExams = (v) => set('exams', v);

  function fileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  // ==================== EXPORT / IMPORT ====================
  function exportAllData() {
    const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams() };
    const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'caeser_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
    alert('✅ تم التصدير');
  }
  function importAllData(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function(ev) {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.students) saveStudents(d.students);
        if (d.groups) saveGroups(d.groups);
        if (d.attendance) saveAttendance(d.attendance);
        if (d.payments) savePayments(d.payments);
        if (d.exams) saveExams(d.exams);
        alert('✅ تم الاستيراد'); navigateTo('dashboard');
      } catch(er) { alert('❌ فشل'); }
    };
    r.readAsText(f);
  }

  // ==================== NAVIGATION ====================
  function navigateTo(page) {
    const fn = window['load' + page.charAt(0).toUpperCase() + page.slice(1)];
    if (fn) fn();
    document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
    const buttons = document.querySelectorAll('.sidebar nav button');
    const titles = { dashboard: 'الرئيسية', students: 'الطلاب', groups: 'المجموعات', attendance: 'الحضور', payments: 'المدفوعات', exams: 'الامتحانات', reports: 'التقارير' };
    buttons.forEach(b => { if (b.textContent.includes(titles[page] || '')) b.classList.add('active'); });
  }
  window.addEventListener('DOMContentLoaded', () => navigateTo('dashboard'));

  // ==================== DASHBOARD ====================
  function loadDashboard() {
    const m = document.getElementById('main-content');
    const st = students(), gr = groups(), att = attendance(), pay = payments(), ex = exams();
    const today = new Date().toISOString().slice(0,10);
    const pres = att.filter(a => a.date === today && a.status === 'present').length;
    const tot = pay.reduce((s,p) => s + p.amount, 0);
    const ov = st.filter(s => pay.filter(p => p.studentId === s.id).length === 0);

    let h = `<div class="dash-header"><h1>👋 أهلاً بك في Caeser of History</h1><p>لوحة التحكم الرئيسية - إدارة متكاملة لمجموعاتك</p></div>
      <div class="stats-row">
        <div class="stat-card animate-card"><div class="sicon blue">👨‍🎓</div><div><div class="sval">${st.length}</div><div class="slbl">إجمالي الطلاب</div></div></div>
        <div class="stat-card animate-card stagger-1"><div class="sicon green">👥</div><div><div class="sval">${gr.length}</div><div class="slbl">المجموعات</div></div></div>
        <div class="stat-card animate-card stagger-2"><div class="sicon orange">📋</div><div><div class="sval">${pres}</div><div class="slbl">حضور اليوم</div></div></div>
        <div class="stat-card animate-card stagger-3"><div class="sicon purple">💰</div><div><div class="sval">${tot} ج.م</div><div class="slbl">المدفوعات</div></div></div>
      </div>`;
    if (ov.length) h += `<div class="alert animate-slide">⚠️ ${ov.length} طلاب لم يسددوا بعد: ${ov.map(s=>s.name).join('، ')}</div>`;
    h += `<div class="grid">
      <div class="dash-card animate-card stagger-1" onclick="navigateTo('students')"><span class="ico">👨‍🎓</span><div class="ttl">الطلاب</div><div class="sub">${st.length} طالب مسجل</div></div>
      <div class="dash-card animate-card stagger-2" onclick="navigateTo('groups')"><span class="ico">👥</span><div class="ttl">المجموعات</div><div class="sub">${gr.length} مجموعة</div></div>
      <div class="dash-card animate-card stagger-3" onclick="navigateTo('attendance')"><span class="ico">📋</span><div class="ttl">الحضور</div><div class="sub">${pres} حاضر اليوم</div></div>
      <div class="dash-card animate-card stagger-4" onclick="navigateTo('payments')"><span class="ico">💰</span><div class="ttl">المدفوعات</div><div class="sub">${tot} ج.م</div></div>
      <div class="dash-card animate-card stagger-5" onclick="navigateTo('exams')"><span class="ico">📝</span><div class="ttl">الامتحانات</div><div class="sub">${ex.length} امتحان</div></div>
      <div class="dash-card animate-card stagger-6" onclick="navigateTo('reports')"><span class="ico">📊</span><div class="ttl">التقارير</div><div class="sub">عرض الإحصائيات</div></div>
    </div>`;
    m.innerHTML = h;
  }

  // ==================== STUDENTS ====================
  function loadStudents() {
    const m = document.getElementById('main-content'), gr = groups();
    let h = `<div class="page"><h2>👨‍🎓 إدارة الطلاب</h2><div class="search"><input type="text" id="ss" placeholder="🔍 بحث عن طالب..." oninput="filterStudents()"></div>
      <form id="sf"><input type="text" id="sn" placeholder="اسم الطالب كاملاً" required><input type="tel" id="sp" placeholder="رقم الهاتف" required><input type="tel" id="sg" placeholder="هاتف ولي الأمر"><select id="sgr"><option value="">-- اختر المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><button type="submit">➕ إضافة طالب</button></form>
      <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>ولي الأمر</th><th>المجموعة</th><th>الإجراءات</th></tr></thead><tbody id="stb"></tbody></table></div>`;
    m.innerHTML = h;
    renderStudentTable(students());
    document.getElementById('sf').onsubmit = function(e) {
      e.preventDefault();
      const n = document.getElementById('sn').value.trim(), p = document.getElementById('sp').value.trim();
      const g = document.getElementById('sg').value.trim(), gid2 = document.getElementById('sgr').value;
      if (!n || !p) return alert('الاسم والهاتف مطلوبان');
      saveStudents([...students(), { id: gid(), name: n, phone: p, guardianPhone: g || null, groupId: gid2 || null }]);
      alert('✅ تمت الإضافة'); loadStudents();
    };
  }
  function renderStudentTable(list) {
    const gr = groups();
    const tbody = document.getElementById('stb');
    if (!tbody) return;
    tbody.innerHTML = list.map(s => {
      const g = gr.find(x => x.id === s.groupId);
      return `<tr><td><strong>${s.name}</strong></td><td><a href="tel:${s.phone}">${s.phone}</a></td><td>${s.guardianPhone||'—'}</td><td>${g?g.name:'—'}</td>
      <td><button class="btn btn-view" onclick="viewStudent('${s.id}')">👁️</button><button class="btn btn-edit" onclick="editStudent('${s.id}')">✏️</button><button class="btn btn-del" onclick="deleteStudentFull('${s.id}')">🗑️</button></td></tr>`;
    }).join('');
  }
  function filterStudents() {
    const q = document.getElementById('ss').value.toLowerCase();
    renderStudentTable(students().filter(s => s.name.toLowerCase().includes(q) || s.phone.includes(q)));
  }
  function editStudent(id) {
    const s = studentById(id); if (!s) return;
    const n = prompt('الاسم:', s.name); if (n === null) return;
    const p = prompt('الهاتف:', s.phone); if (p === null) return;
    const g = prompt('ولي الأمر:', s.guardianPhone || '');
    const gr = groups();
    const c = prompt('رقم المجموعة:\n' + gr.map((x,i) => (i+1)+'-'+x.name).join('\n') + '\n(0=بدون)', s.groupId ? gr.findIndex(x=>x.id===s.groupId)+1 : '0');
    let gid2 = null;
    if (c && parseInt(c) > 0 && gr[parseInt(c)-1]) gid2 = gr[parseInt(c)-1].id;
    const all = students(); all[all.findIndex(x=>x.id===id)] = { ...s, name: n, phone: p, guardianPhone: g||null, groupId: gid2 };
    saveStudents(all); alert('✅ تم التعديل'); loadStudents();
  }
  function deleteStudentFull(id) {
    if (!confirm('⚠️ حذف الطالب وكل بياناته؟')) return;
    saveStudents(students().filter(s => s.id !== id));
    saveAttendance(attendance().filter(a => a.studentId !== id));
    savePayments(payments().filter(p => p.studentId !== id));
    saveExams(exams().filter(e => e.studentId !== id));
    alert('🗑️ تم الحذف'); loadStudents();
  }
  function viewStudent(id) {
    const s = studentById(id); if (!s) return;
    const g = groupById(s.groupId), att = attendance().filter(a => a.studentId === s.id);
    const pay = payments().filter(p => p.studentId === s.id), ex = exams().filter(e => e.studentId === s.id);
    const tot = pay.reduce((sum,p) => sum + p.amount, 0), pres = att.filter(a => a.status === 'present').length;
    const pct = att.length ? Math.round((pres/att.length)*100) : 0;

    document.getElementById('main-content').innerHTML = `
      <div class="page"><h2>📋 ${s.name}</h2>
      <table><tr><td><strong>📞 الهاتف</strong></td><td><a href="tel:${s.phone}">${s.phone}</a></td></tr>
      <tr><td><strong>👨‍👩‍👦 ولي الأمر</strong></td><td>${s.guardianPhone||'—'}</td></tr>
      <tr><td><strong>👥 المجموعة</strong></td><td>${g?g.name:'—'}</td></tr>
      <tr><td><strong>📊 نسبة الحضور</strong></td><td>${pct}% (${pres}/${att.length})</td></tr>
      <tr><td><strong>💰 المدفوعات</strong></td><td>${tot} ج.م</td></tr>
      <tr><td><strong>📝 متوسط الدرجات</strong></td><td>${ex.length ? (ex.reduce((s,e)=>s+e.score,0)/ex.length).toFixed(1) : '—'}</td></tr></table>
      <div class="act-bar"><button class="btn btn-back" onclick="loadStudents()">⬅️ رجوع للطلاب</button></div></div>`;
  }

  // ==================== GROUPS ====================
  function loadGroups() {
    const m = document.getElementById('main-content'), gr = groups(), st = students();
    let h = `<div class="page"><h2>👥 المجموعات</h2>
      <form id="gf"><input type="text" id="gn" placeholder="اسم المجموعة" required><input type="text" id="gs" placeholder="المواعيد"><button type="submit">➕ إضافة</button></form>
      <table><thead><tr><th>المجموعة</th><th>المواعيد</th><th>الطلاب</th><th>واتساب</th><th>إجراءات</th></tr></thead><tbody>`;
    gr.forEach(g => {
      const cnt = st.filter(s => s.groupId === g.id).length;
      h += `<tr><td><strong>${g.name}</strong></td><td>${g.schedule||'—'}</td><td>${cnt}</td>
      <td><button class="btn btn-wa" onclick="sendWhatsapp('${g.id}')">📱</button></td>
      <td><button class="btn btn-edit" onclick="editGroup('${g.id}')">✏️</button><button class="btn btn-del" onclick="deleteGroup('${g.id}')">🗑️</button></td></tr>`;
    });
    h += '</tbody></table></div>'; m.innerHTML = h;
    document.getElementById('gf').onsubmit = function(e) {
      e.preventDefault();
      const n = document.getElementById('gn').value.trim(); if (!n) return;
      saveGroups([...groups(), { id: gid(), name: n, schedule: document.getElementById('gs').value.trim() }]);
      alert('✅ تمت الإضافة'); loadGroups();
    };
  }
  function editGroup(id) {
    const g = groupById(id); if (!g) return;
    const n = prompt('الاسم:', g.name); if (n === null) return;
    const s = prompt('المواعيد:', g.schedule || '');
    const all = groups(); all[all.findIndex(x=>x.id===id)] = { ...g, name: n, schedule: s };
    saveGroups(all); alert('✅ تم التعديل'); loadGroups();
  }
  function deleteGroup(id) {
    if (!confirm('حذف المجموعة؟')) return;
    saveGroups(groups().filter(g => g.id !== id));
    saveStudents(students().map(s => s.groupId === id ? {...s, groupId: null} : s));
    alert('🗑️ تم الحذف'); loadGroups();
  }
  function sendWhatsapp(gid2) {
    const st = students().filter(s => s.groupId === gid2);
    if (!st.length) return alert('لا يوجد طلاب');
    const msg = prompt('الرسالة:'); if (!msg) return;
    st.forEach(s => { const p = s.phone.replace(/[^0-9]/g, ''); if (p) window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(msg), '_blank'); });
  }

  // ==================== ATTENDANCE ====================
  function loadAttendance() {
    const m = document.getElementById('main-content'), gr = groups();
    let h = `<div class="page"><h2>📋 الحضور</h2>
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;"><select id="ag"><option value="">-- المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><input type="date" id="ad"><button class="btn btn-view" onclick="showAttendance()">📅 عرض</button></div>
      <div id="attf"></div><h3 style="margin-top:24px;">سجل سابق</h3><div id="atth"></div></div>`;
    m.innerHTML = h; renderAttHistory();
  }
  function showAttendance() {
    const gid2 = document.getElementById('ag').value, date = document.getElementById('ad').value;
    if (!gid2 || !date) return alert('اختر المجموعة والتاريخ');
    const st = students().filter(s => s.groupId === gid2);
    if (!st.length) return document.getElementById('attf').innerHTML = '<p>لا يوجد طلاب</p>';
    const ex = attendance().filter(a => a.groupId === gid2 && a.date === date);
    const map = {}; ex.forEach(a => map[a.studentId] = a.status);
    let f = '<form id="saf"><table><thead><tr><th>الطالب</th><th>حاضر</th><th>غائب</th></tr></thead><tbody>';
    st.forEach(s => f += `<tr><td>${s.name}</td><td><input type="radio" name="a-${s.id}" value="present" ${map[s.id]!=='absent'?'checked':''}></td><td><input type="radio" name="a-${s.id}" value="absent" ${map[s.id]==='absent'?'checked':''}></td></tr>`);
    f += '</tbody></table><div class="act-bar"><button type="submit" class="btn btn-save">💾 حفظ</button></div></form>';
    document.getElementById('attf').innerHTML = f;
    document.getElementById('saf').onsubmit = function(e) {
      e.preventDefault();
      let all = attendance().filter(a => !(a.groupId === gid2 && a.date === date));
      st.forEach(s => { const r = document.querySelector('input[name="a-' + s.id + '"]:checked'); if (r) all.push({ id: gid(), studentId: s.id, groupId: gid2, date, status: r.value }); });
      saveAttendance(all); alert('✅ تم الحفظ'); loadAttendance();
    };
  }
  function renderAttHistory() {
    const all = attendance();
    const atth = document.getElementById('atth');
    if (!atth) return;
    if (!all.length) return atth.innerHTML = '<p>لا سجل</p>';
    const grouped = {};
    all.forEach(a => { const k = a.date + a.groupId; if (!grouped[k]) grouped[k] = { date: a.date, groupId: a.groupId, present: 0, absent: 0 }; a.status === 'present' ? grouped[k].present++ : grouped[k].absent++; });
    let t = '<table><thead><tr><th>التاريخ</th><th>المجموعة</th><th>حضور</th><th>غياب</th></tr></thead><tbody>';
    Object.values(grouped).forEach(r => { const g = groupById(r.groupId); t += `<tr><td>${r.date}</td><td>${g?g.name:'—'}</td><td>${r.present}</td><td>${r.absent}</td></tr>`; });
    t += '</tbody></table>'; atth.innerHTML = t;
  }

  // ==================== PAYMENTS ====================
  function loadPayments() {
    const m = document.getElementById('main-content'), st = students(), pay = payments();
    let h = `<div class="page"><h2>💰 المدفوعات</h2>
      <form id="pf"><select id="ps" required><option value="">-- الطالب --</option>${st.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><input type="number" id="pa" placeholder="المبلغ" required><input type="date" id="pd" required><input type="text" id="pn" placeholder="ملاحظات"><button type="submit">➕ إضافة</button></form>
      <table><thead><tr><th>الطالب</th><th>المبلغ</th><th>التاريخ</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody>`;
    pay.forEach(p => { const s = st.find(x => x.id === p.studentId); h += `<tr><td>${s?s.name:'—'}</td><td>${p.amount} ج.م</td><td>${p.date}</td><td>${p.notes||''}</td><td><button class="btn btn-del" onclick="deletePayment('${p.id}')">🗑️</button></td></tr>`; });
    h += '</tbody></table></div>'; m.innerHTML = h;
    document.getElementById('pf').onsubmit = function(e) {
      e.preventDefault();
      const sid = document.getElementById('ps').value, amt = parseFloat(document.getElementById('pa').value);
      const date = document.getElementById('pd').value, notes = document.getElementById('pn').value.trim();
      if (!sid || isNaN(amt) || !date) return alert('بيانات ناقصة');
      savePayments([...payments(), { id: gid(), studentId: sid, amount: amt, date, notes }]);
      alert('✅ تمت الإضافة'); loadPayments();
    };
  }
  function deletePayment(id) { if (!confirm('حذف؟')) return; savePayments(payments().filter(p => p.id !== id)); loadPayments(); }

  // ==================== EXAMS (WITH FILE UPLOAD) ====================
  function loadExams() {
    const m = document.getElementById('main-content'), st = students(), ex = exams();
    let h = `<div class="page"><h2>📝 الامتحانات</h2>
      <form id="ef">
        <select id="es" required><option value="">-- اختر الطالب --</option>${st.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
        <input type="text" id="en" placeholder="اسم الامتحان" required>
        <input type="number" id="esc" placeholder="الدرجة" required>
        <input type="date" id="ed" required>
        <label class="file-upload-label" for="efile">📎 رفع ملف (PDF/صورة)</label>
        <input type="file" id="efile" accept=".pdf,image/*" onchange="document.getElementById('file-name').textContent = this.files[0]?.name || 'لم يتم اختيار ملف'">
        <span id="file-name" style="font-size:12px;color:var(--text-light);">لم يتم اختيار ملف</span>
        <button type="submit">➕ تسجيل امتحان</button>
      </form>
      <table><thead><tr><th>الطالب</th><th>الامتحان</th><th>الدرجة</th><th>التاريخ</th><th>ملف</th><th>حذف</th></tr></thead><tbody>`;
    ex.forEach(e => {
      const s = st.find(x => x.id === e.studentId);
      const fileLink = e.fileData ? `<a href="${e.fileData}" download="${e.fileName||'exam'}" class="file-link">📥 ${e.fileName||'تحميل'}</a>` : '—';
      h += `<tr><td>${s?s.name:'—'}</td><td>${e.examName}</td><td>${e.score}</td><td>${e.date}</td><td>${fileLink}</td><td><button class="btn btn-del" onclick="deleteExam('${e.id}')">🗑️</button></td></tr>`;
    });
    h += '</tbody></table></div>'; m.innerHTML = h;
    document.getElementById('ef').onsubmit = async function(e) {
      e.preventDefault();
      const sid = document.getElementById('es').value, en = document.getElementById('en').value.trim();
      const sc = parseInt(document.getElementById('esc').value), date = document.getElementById('ed').value;
      const fileInput = document.getElementById('efile');
      if (!sid || !en || isNaN(sc) || !date) return alert('بيانات ناقصة');

      let fileData = null, fileName = null;
      if (fileInput.files[0]) {
        if (fileInput.files[0].size > 5 * 1024 * 1024) return alert('حجم الملف كبير جداً. الحد الأقصى 5 ميجابايت');
        fileData = await fileToBase64(fileInput.files[0]);
        fileName = fileInput.files[0].name;
      }

      saveExams([...exams(), { id: gid(), studentId: sid, examName: en, score: sc, date, fileData, fileName }]);
      alert('✅ تم تسجيل الامتحان'); loadExams();
    };
  }
  function deleteExam(id) { if (!confirm('حذف؟')) return; saveExams(exams().filter(e => e.id !== id)); loadExams(); }

  // ==================== REPORTS ====================
  function loadReports() {
    const m = document.getElementById('main-content');
    const st = students(), att = attendance(), pay = payments(), ex = exams(), gr = groups();
    let h = `<div class="page"><h2>📊 التقارير</h2>`;

    if (gr.length > 0) {
      h += `<div class="chart-wrap"><h3>👥 توزيع الطلاب</h3><canvas id="groupChart" height="80"></canvas></div>`;
      setTimeout(() => {
        const ctx = document.getElementById('groupChart');
        if (ctx) new Chart(ctx, { type: 'bar', data: { labels: gr.map(g => g.name), datasets: [{ label: 'الطلاب', data: gr.map(g => st.filter(s => s.groupId === g.id).length), backgroundColor: ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#3b82f6'] }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
      }, 100);
    }

    h += `<h3 style="margin-top:22px;">📋 ملخص الطلاب</h3><table><thead><tr><th>الطالب</th><th>المجموعة</th><th>حضور%</th><th>مدفوعات</th><th>متوسط</th></tr></thead><tbody>`;
    st.forEach(s => {
      const g = groupById(s.groupId), a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length;
      const pct = a.length ? Math.round((pr/a.length)*100) : 0;
      const tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0);
      const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0;
      h += `<tr><td>${s.name}</td><td>${g?g.name:'—'}</td><td>${pct}%</td><td>${tot} ج.م</td><td>${avg}</td></tr>`;
    });
    h += '</tbody></table>';

    h += `<h3 style="margin-top:22px;">👥 ملخص المجموعات</h3><table><thead><tr><th>المجموعة</th><th>الطلاب</th><th>متوسط الحضور</th></tr></thead><tbody>`;
    gr.forEach(g => {
      const gs = st.filter(s => s.groupId === g.id);
      if (!gs.length) return;
      let tp = 0;
      gs.forEach(s => { const a = att.filter(x => x.studentId === s.id); tp += a.length ? (a.filter(x=>x.status==='present').length/a.length)*100 : 0; });
      h += `<tr><td>${g.name}</td><td>${gs.length}</td><td>${(tp/gs.length).toFixed(1)}%</td></tr>`;
    });
    h += '</tbody></table></div>';
    m.innerHTML = h;
  }
</script>
</body>
  </html>
