  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text-light: #64748b;
      --border: #e2e8f0; --primary: #6366f1; --primary-dark: #4f46e5;
      --shadow: 0 4px 15px rgba(0,0,0,0.06); --shadow-lg: 0 15px 40px rgba(0,0,0,0.12);
      --sidebar-w: 380px; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; min-height: 100dvh;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(25px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    .animate-in { animation: fadeInUp 0.5s ease-out; }
    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: linear-gradient(180deg, #0f172a, #1e293b); color: #fff;
      padding: 30px 20px; display: flex; flex-direction: column; position: fixed;
      right: 0; top: 0; bottom: 0; z-index: 100; box-shadow: 8px 0 40px rgba(0,0,0,0.4);
      overflow-y: auto;
    }
    .sidebar .logo { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid rgba(255,255,255,0.1); animation: float 3s infinite; }
    .sidebar .logo .sicon { font-size: 70px; display: block; margin-bottom: 12px; }
    .sidebar .logo h2 { font-size: 30px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    .sidebar .logo p { font-size: 16px; color: #94a3b8; }
    .sidebar nav { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sidebar nav button {
      display: flex; align-items: center; gap: 20px; width: 100%; background: none; border: none;
      color: #cbd5e1; padding: 20px 22px; font-size: 22px; cursor: pointer; border-radius: 16px;
      transition: all 0.3s; font-weight: 600;
    }
    .sidebar nav button:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateX(-8px); }
    .sidebar nav button.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-weight: 800; box-shadow: 0 10px 30px rgba(99,102,241,0.5); }
    .sidebar nav button .nav-icon { font-size: 32px; width: 48px; text-align: center; }
    .sidebar .bottom { margin-top: auto; padding-top: 22px; border-top: 2px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 12px; }
    .sidebar .bottom button {
      width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; font-weight: 800;
      font-size: 18px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: all 0.3s;
    }
    .btn-ex { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-im { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

    .content { flex: 1; margin-right: var(--sidebar-w); padding: 30px; min-height: 100vh; display: flex; flex-direction: column; }

    .dash-header { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 40px 35px; border-radius: 20px; margin-bottom: 25px; box-shadow: var(--shadow-lg); animation: scaleIn 0.5s; }
    .dash-header h1 { font-size: 36px; font-weight: 900; }
    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin-bottom: 25px; }
    .stat-card { background: var(--card); padding: 24px; border-radius: 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 18px; transition: 0.3s; }
    .stat-card:hover { transform: translateY(-5px); }
    .stat-card .sicon { font-size: 48px; width: 70px; height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .stat-card .sval { font-size: 34px; font-weight: 900; }
    .stat-card .slbl { font-size: 15px; color: var(--text-light); }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .dash-card { background: var(--card); border-radius: 18px; padding: 35px 20px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: 0.35s; border-top: 6px solid var(--primary); min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .dash-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
    .dash-card .ico { font-size: 60px; margin-bottom: 14px; }
    .dash-card .ttl { font-weight: 900; font-size: 20px; }
    .dash-card .sub { font-size: 14px; color: var(--text-light); }

    .page { background: var(--card); border-radius: 20px; padding: 30px; box-shadow: var(--shadow); animation: scaleIn 0.4s; flex: 1; }
    .page h2 { margin-bottom: 22px; font-size: 30px; }
    .search input { padding: 15px 20px; border: 2px solid var(--border); border-radius: 14px; width: 350px; font-size: 17px; background: var(--bg); }
    form { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; background: var(--bg); padding: 20px; border-radius: 16px; align-items: flex-end; }
    form input, form select { padding: 14px 18px; border: 2px solid var(--border); border-radius: 12px; font-size: 17px; background: #fff; }
    form button { padding: 14px 26px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 17px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th { background: #f8fafc; padding: 18px 14px; font-weight: 800; border-bottom: 3px solid var(--primary); font-size: 17px; }
    td { padding: 15px 14px; border-bottom: 1px solid var(--border); text-align: center; font-size: 16px; }
    .btn { padding: 9px 18px; margin: 3px; border: none; border-radius: 10px; cursor: pointer; color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; }
    .btn:hover { transform: scale(1.05); }
    .btn-edit { background: #f59e0b; } .btn-del { background: #ef4444; } .btn-view { background: #3b82f6; }
    .btn-wa { background: #25D366; } .btn-save { background: #10b981; } .btn-back { background: #64748b; }
    .btn-share { background: #3b82f6; } .btn-qr { background: #8b5cf6; } .btn-print { background: #f59e0b; }

    .alert { background: #fef3c7; padding: 16px; border-radius: 14px; margin: 16px 0; color: #92400e; font-weight: 700; border-right: 5px solid #f59e0b; }
    .notification { background: #fee2e2; padding: 12px; border-radius: 12px; margin: 8px 0; color: #991b1b; display: flex; align-items: center; gap: 10px; }
    .chart-wrap { background: var(--card); padding: 24px; border-radius: 18px; margin: 20px 0; }
    canvas { max-width: 100%; }
    .store-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .store-card { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: var(--shadow); text-align: center; transition: 0.3s; }
    .store-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .store-card .file-icon { font-size: 60px; }
    .store-card .file-name { font-weight: 800; margin: 10px 0; word-break: break-all; }
    .badge { background: var(--danger); color: #fff; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin-right: 8px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar select { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); }
    .points { display: inline-block; background: #ede9fe; color: #5b21b6; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 13px; }

    @media (max-width: 1024px) {
      :root { --sidebar-w: 300px; }
      .stats-row { grid-template-columns: repeat(3, 1fr); }
      .grid { grid-template-columns: repeat(3, 1fr); }
      .store-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { position: relative; width: 100%; min-width: 100%; padding: 18px; }
      .content { margin-right: 0; padding: 16px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .store-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="app-container">
  <nav class="sidebar">
    <div class="logo"><span class="sicon">📜</span><h2>Caeser of History</h2><p>إدارة المجموعات التعليمية</p></div>
    <nav>
      <button class="active" onclick="navigateTo('dashboard')"><span class="nav-icon">🏠</span> الرئيسية</button>
      <button onclick="navigateTo('students')"><span class="nav-icon">👨‍🎓</span> الطلاب</button>
      <button onclick="navigateTo('groups')"><span class="nav-icon">👥</span> المجموعات</button>
      <button onclick="navigateTo('attendance')"><span class="nav-icon">📋</span> الحضور</button>
      <button onclick="navigateTo('payments')"><span class="nav-icon">💰</span> المدفوعات</button>
      <button onclick="navigateTo('exams')"><span class="nav-icon">📝</span> الامتحانات</button>
      <button onclick="navigateTo('store')"><span class="nav-icon">🗄️</span> المخزن</button>
      <button onclick="navigateTo('reports')"><span class="nav-icon">📊</span> التقارير</button>
    </nav>
    <div class="bottom">
      <button class="btn-ex" onclick="exportAllData()">💾 تصدير البيانات</button>
      <button class="btn-im" onclick="document.getElementById('ifile').click()">📂 استيراد البيانات</button>
      <input type="file" id="ifile" accept=".json" style="display:none" onchange="importAllData(event)">
    </div>
  </nav>
  <main id="main-content" class="content"></main>
</div>

<script>
  // ==================== DATA LAYER ====================
  const PREFIX = 'caeser_';
  function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
  function get(key) { return JSON.parse(localStorage.getItem(PREFIX + key) || '[]'); }
  function set(key, v) { localStorage.setItem(PREFIX + key, JSON.stringify(v)); }
  const students = () => get('students'), saveStudents = (v) => set('students', v), studentById = (id) => students().find(s => s.id === id);
  const groups = () => get('groups'), saveGroups = (v) => set('groups', v), groupById = (id) => groups().find(g => g.id === id);
  const attendance = () => get('attendance'), saveAttendance = (v) => set('attendance', v);
  const payments = () => get('payments'), savePayments = (v) => set('payments', v);
  const exams = () => get('exams'), saveExams = (v) => set('exams', v);
  const storeFiles = () => get('store'), saveStore = (v) => set('store', v);
  const activityLog = () => get('activity'), saveActivity = (v) => set('activity', v);
  const notifications = () => get('notifications'), saveNotifications = (v) => set('notifications', v);

  function logActivity(action) {
    const log = activityLog();
    log.push({ id: gid(), action, time: new Date().toISOString() });
    if (log.length > 100) log.splice(0, 20);
    saveActivity(log);
  }
  function addNotification(msg) {
    const n = notifications();
    n.push({ id: gid(), msg, seen: false });
    saveNotifications(n);
  }
  function autoBackup() {
    const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles() };
    localStorage.setItem(PREFIX + 'auto_backup', JSON.stringify(d));
  }
  setInterval(autoBackup, 60000); // نسخ احتياطي كل دقيقة

  function fileToBase64(file) { return new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); }); }

  // ==================== EXPORT/IMPORT ====================
  function exportAllData() {
    const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles(), activity: activityLog() };
    const blob = new Blob([JSON.stringify(d)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'caeser_full_backup.json'; a.click();
    logActivity('تصدير كامل للبيانات');
  }
  function importAllData(e) {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.students) saveStudents(d.students);
        if (d.groups) saveGroups(d.groups);
        if (d.attendance) saveAttendance(d.attendance);
        if (d.payments) savePayments(d.payments);
        if (d.exams) saveExams(d.exams);
        if (d.store) saveStore(d.store);
        if (d.activity) saveActivity(d.activity);
        alert('✅ تم الاستيراد'); navigateTo('dashboard');
      } catch (er) { alert('❌ فشل'); }
    };
    reader.readAsText(f);
  }

  // ==================== SHARE & UTILS ====================
  function shareText(text) { if (navigator.share) navigator.share({ title: 'Caeser', text }); else window.open('https://wa.me/?text=' + encodeURIComponent(text)); }
  function printDiv(html) { const win = window.open('', '_blank'); win.document.write('<html><head><style>body{font-family:Tahoma;direction:rtl;padding:20px;}table{width:100%;border-collapse:collapse;}td,th{border:1px solid #ddd;padding:8px;}</style></head><body>' + html + '</body></html>'); win.print(); }

  // ==================== NAVIGATION ====================
  function navigateTo(page) {
    const fn = window['load' + page.charAt(0).toUpperCase() + page.slice(1)];
    if (fn) fn();
    document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
    const titles = { dashboard: 'الرئيسية', students: 'الطلاب', groups: 'المجموعات', attendance: 'الحضور', payments: 'المدفوعات', exams: 'الامتحانات', store: 'المخزن', reports: 'التقارير' };
    document.querySelectorAll('.sidebar nav button').forEach(b => { if (b.textContent.includes(titles[page]||'')) b.classList.add('active'); });
    logActivity('انتقال إلى ' + (titles[page]||page));
  }
  window.addEventListener('DOMContentLoaded', () => {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    navigateTo('dashboard');
  });

  // ==================== DASHBOARD ====================
  function loadDashboard() {
    const m = document.getElementById('main-content');
    const st = students(), gr = groups(), att = attendance(), pay = payments(), ex = exams(), sf = storeFiles();
    const today = new Date().toISOString().slice(0,10);
    const pres = att.filter(a => a.date === today && a.status === 'present').length;
    const tot = pay.reduce((s,p) => s + p.amount, 0);
    const ov = st.filter(s => pay.filter(p => p.studentId === s.id).length === 0);
    const unread = notifications().filter(n => !n.seen).length;

    let h = `<div class="dash-header"><h1>👋 أهلاً بك</h1><p>Caeser of History - لوحة التحكم</p></div>
      <div class="stats-row">
        <div class="stat-card"><div class="sicon" style="background:#dbeafe;">👨‍🎓</div><div><div class="sval">${st.length}</div><div class="slbl">طالب</div></div></div>
        <div class="stat-card"><div class="sicon" style="background:#d1fae5;">👥</div><div><div class="sval">${gr.length}</div><div class="slbl">مجموعة</div></div></div>
        <div class="stat-card"><div class="sicon" style="background:#fef3c7;">📋</div><div><div class="sval">${pres}</div><div class="slbl">حضور اليوم</div></div></div>
        <div class="stat-card"><div class="sicon" style="background:#ede9fe;">💰</div><div><div class="sval">${tot} ج.م</div><div class="slbl">مدفوعات</div></div></div>
        <div class="stat-card"><div class="sicon" style="background:#e0e7ff;">🔔</div><div><div class="sval">${unread}</div><div class="slbl">إشعارات</div></div></div>
      </div>`;
    if (ov.length) h += `<div class="alert">⚠️ ${ov.length} طلاب لم يسددوا: ${ov.map(s=>s.name).join('، ')}</div>`;
    const notifs = notifications().slice(-3);
    notifs.forEach(n => h += `<div class="notification">🔔 ${n.msg}</div>`);
    h += `<div class="grid">
      <div class="dash-card" onclick="navigateTo('students')"><span class="ico">👨‍🎓</span><div class="ttl">الطلاب</div><div class="sub">${st.length} طالب</div></div>
      <div class="dash-card" onclick="navigateTo('groups')"><span class="ico">👥</span><div class="ttl">المجموعات</div><div class="sub">${gr.length} مجموعة</div></div>
      <div class="dash-card" onclick="navigateTo('attendance')"><span class="ico">📋</span><div class="ttl">الحضور</div><div class="sub">${pres} حاضر</div></div>
      <div class="dash-card" onclick="navigateTo('payments')"><span class="ico">💰</span><div class="ttl">المدفوعات</div><div class="sub">${tot} ج.م</div></div>
      <div class="dash-card" onclick="navigateTo('exams')"><span class="ico">📝</span><div class="ttl">الامتحانات</div><div class="sub">${ex.length} امتحان</div></div>
      <div class="dash-card" onclick="navigateTo('store')"><span class="ico">🗄️</span><div class="ttl">المخزن</div><div class="sub">${sf.length} ملف</div></div>
      <div class="dash-card" onclick="navigateTo('reports')"><span class="ico">📊</span><div class="ttl">التقارير</div><div class="sub">عرض الكل</div></div>
    </div>`;
    m.innerHTML = h;
  }

  // ==================== STUDENTS (with filters, QR, points) ====================
  function loadStudents() {
    const m = document.getElementById('main-content'), gr = groups();
    let h = `<div class="page"><h2>👨‍🎓 الطلاب</h2>
      <div class="search"><input type="text" id="ss" placeholder="🔍 بحث..." oninput="renderStudentTable(filterStudentList())"></div>
      <div class="filter-bar">
        <select id="filterGroup" onchange="renderStudentTable(filterStudentList())"><option value="">كل المجموعات</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>
        <select id="filterPayment" onchange="renderStudentTable(filterStudentList())"><option value="">الدفع</option><option value="paid">سدد</option><option value="unpaid">لم يسدد</option></select>
        <select id="filterAttendance" onchange="renderStudentTable(filterStudentList())"><option value="">الحضور</option><option value="high">≥70%</option><option value="low"><70%</option></select>
      </div>
      <form id="sf">
        <input type="text" id="sn" placeholder="اسم الطالب" required><input type="tel" id="sp" placeholder="الهاتف" required>
        <input type="tel" id="sg" placeholder="ولي الأمر"><select id="sgr"><option value="">-- المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>
        <button type="submit">➕ إضافة</button>
      </form>
      <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المجموعة</th><th>النقاط</th><th>QR</th><th>مشاركة</th><th>إجراءات</th></tr></thead><tbody id="stb"></tbody></table></div>`;
    m.innerHTML = h;
    renderStudentTable(students());
    document.getElementById('sf').onsubmit = function(e) {
      e.preventDefault();
      const n = document.getElementById('sn').value.trim(), p = document.getElementById('sp').value.trim();
      const g = document.getElementById('sg').value.trim(), gid2 = document.getElementById('sgr').value;
      if (!n || !p) return alert('الاسم والهاتف مطلوبان');
      saveStudents([...students(), { id: gid(), name: n, phone: p, guardianPhone: g || null, groupId: gid2 || null, points: 0, level: 1 }]);
      logActivity('إضافة طالب: ' + n); addNotification('طالب جديد: ' + n);
      loadStudents();
    };
  }
  function filterStudentList() {
    let list = students();
    const g = document.getElementById('filterGroup')?.value;
    const p = document.getElementById('filterPayment')?.value;
    const a = document.getElementById('filterAttendance')?.value;
    if (g) list = list.filter(s => s.groupId === g);
    if (p === 'paid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length > 0);
    if (p === 'unpaid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length === 0);
    if (a === 'high') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length && (att.filter(x=>x.status==='present').length/att.length) >= 0.7; });
    if (a === 'low') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length === 0 || (att.filter(x=>x.status==='present').length/att.length) < 0.7; });
    const q = document.getElementById('ss')?.value.toLowerCase();
    if (q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.phone.includes(q));
    return list;
  }
  function renderStudentTable(list) {
    const gr = groups(), tbody = document.getElementById('stb');
    if (!tbody) return;
    tbody.innerHTML = list.map(s => {
      const g = gr.find(x => x.id === s.groupId);
      return `<tr><td><strong>${s.name}</strong></td><td>${s.phone}</td><td>${g?g.name:'—'}</td>
        <td><span class="points">⭐ ${s.points||0}</span></td>
        <td><button class="btn btn-qr" onclick="showQR('${s.id}')">📱</button></td>
        <td><button class="btn btn-share" onclick="shareStudent('${s.id}')">📤</button></td>
        <td><button class="btn btn-view" onclick="viewStudent('${s.id}')">👁️</button><button class="btn btn-edit" onclick="editStudent('${s.id}')">✏️</button><button class="btn btn-del" onclick="deleteStudentFull('${s.id}')">🗑️</button></td></tr>`;
    }).join('');
  }
  function showQR(id) {
    const s = studentById(id); if (!s) return;
    const data = `الطالب: ${s.name}\nالهاتف: ${s.phone}`;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:999';
    modal.innerHTML = `<div style="background:#fff;padding:30px;border-radius:20px;text-align:center"><h3>${s.name}</h3><div id="qrcode"></div><button class="btn btn-back" onclick="this.closest('div').parentElement.remove()">إغلاق</button></div>`;
    document.body.appendChild(modal);
    new QRCode(document.getElementById('qrcode'), { text: data, width: 200, height: 200 });
  }

  function editStudent(id) {
    const s = studentById(id); if (!s) return;
    const n = prompt('الاسم:', s.name); if (n === null) return;
    const p = prompt('الهاتف:', s.phone); if (p === null) return;
    const g = prompt('ولي الأمر:', s.guardianPhone || '');
    const gr = groups();
    const c = prompt('رقم المجموعة:\n' + gr.map((x,i) => (i+1)+'-'+x.name).join('\n') + '\n(0=بدون)', s.groupId ? gr.findIndex(x=>x.id===s.groupId)+1 : '0');
    let gid2 = null; if (c && parseInt(c) > 0 && gr[parseInt(c)-1]) gid2 = gr[parseInt(c)-1].id;
    const points = parseInt(prompt('النقاط:', s.points||0)) || 0;
    const all = students(); all[all.findIndex(x=>x.id===id)] = { ...s, name: n, phone: p, guardianPhone: g||null, groupId: gid2, points };
    saveStudents(all); logActivity('تعديل طالب: ' + n); loadStudents();
  }

    window.open(`https://wa.me/${s.phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
