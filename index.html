<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caeser of History - إدارة المجموعات</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
  <style>
    :root {
      --primary: #4f46e5; --primary-dark: #3730a3; --secondary: #10b981;
      --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
      --text-light: #64748b; --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 20px 40px -5px rgba(0,0,0,0.15);
    }

    .dark-mode {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --text-light: #94a3b8; --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg); min-height: 100vh; color: var(--text);
    }

    .app-container { display: flex; min-height: 100vh; }

    /* ========== الشريط الجانبي ========== */
    .sidebar {
      width: 280px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      color: white; padding: 20px 12px; display: flex; flex-direction: column;
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 100;
      box-shadow: 4px 0 30px rgba(0,0,0,0.3); overflow-y: auto;
    }
    .sidebar .logo { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); }
    .sidebar .logo .icon { font-size: 50px; display: block; margin-bottom: 8px; }
    .sidebar .logo h2 { font-size: 22px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .sidebar .logo p { font-size: 11px; color: #94a3b8; margin-top: 3px; }

    .sidebar .nav-btn {
      display: flex; align-items: center; gap: 12px; width: 100%;
      background: none; border: none; color: #cbd5e1; padding: 14px 15px;
      text-align: right; font-size: 16px; cursor: pointer; border-radius: 12px;
      margin-bottom: 4px; transition: all 0.3s; font-weight: 500;
    }
    .sidebar .nav-btn:hover { background: rgba(255,255,255,0.08); color: white; transform: translateX(-5px); }
    .sidebar .nav-btn.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; box-shadow: 0 4px 15px rgba(79,70,229,0.4); }
    .sidebar .nav-btn .nav-icon { font-size: 24px; width: 40px; text-align: center; }

    .sidebar .bottom-actions { margin-top: auto; padding-top: 15px; border-top: 2px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px; }
    .sidebar .bottom-actions button {
      width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;
      justify-content: center; transition: all 0.3s; color: white;
    }
    .btn-gdrive { background: #4285f4; }
    .btn-export { background: #10b981; }
    .btn-import { background: #8b5cf6; }
    .btn-theme { background: #64748b; }

    /* ========== المحتوى الرئيسي ========== */
    .content { flex: 1; margin-right: 280px; padding: 25px; min-height: 100vh; }

    /* ========== داشبورد ========== */
    .dashboard-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; padding: 35px 30px; border-radius: 20px;
      margin-bottom: 25px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
    }
    .dashboard-header h1 { font-size: 30px; margin-bottom: 6px; position: relative; z-index: 1; }
    .dashboard-header p { font-size: 15px; opacity: 0.9; position: relative; z-index: 1; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 25px; }
    .stat-card {
      background: var(--card); padding: 22px; border-radius: 16px;
      box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; transition: transform 0.3s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card .stat-icon {
      width: 55px; height: 55px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; font-size: 28px;
    }
    .stat-icon.blue { background: #dbeafe; } .stat-icon.green { background: #d1fae5; }
    .stat-icon.orange { background: #fef3c7; } .stat-icon.purple { background: #ede9fe; }
    .stat-value { font-size: 28px; font-weight: 800; }
    .stat-label { font-size: 13px; color: var(--text-light); margin-top: 2px; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .dash-card {
      background: var(--card); border-radius: 18px; padding: 28px 18px;
      text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: all 0.3s; border: 2px solid transparent;
    }
    .dash-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
    .dash-card .card-icon { font-size: 50px; margin-bottom: 12px; display: block; }
    .dash-card .card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .dash-card .card-subtitle { font-size: 12px; color: var(--text-light); }

    /* ========== صفحات ========== */
    .page-container { background: var(--card); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-header h2 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
    .search-box input { padding: 10px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; width: 260px; background: var(--card); color: var(--text); }

    form {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
      background: var(--bg); padding: 18px; border-radius: 14px; align-items: flex-end;
    }
    form input, form select {
      padding: 11px 14px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 14px; background: var(--card); color: var(--text);
    }
    form button {
      padding: 11px 20px; background: var(--primary); color: white;
      border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px;
      transition: all 0.3s; display: flex; align-items: center; gap: 6px;
    }
    form button:hover { background: var(--primary-dark); transform: scale(1.03); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 12px; overflow: hidden; }
    th { background: var(--bg); padding: 14px; text-align: center; font-weight: 700; font-size: 14px; }
    td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: var(--bg); }

    .btn-sm {
      padding: 7px 13px; margin: 0 3px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 600; color: white; transition: all 0.2s;
    }
    .btn-sm:hover { transform: scale(1.08); }
    .btn-edit { background: #f59e0b; } .btn-delete { background: #ef4444; }
    .btn-view { background: #3b82f6; } .btn-whatsapp { background: #25D366; }
    .btn-save { background: #10b981; } .btn-back { background: #64748b; }
    .btn-print { background: #8b5cf6; }

    .alert-box { background: #fef3c7; border: 1px solid #f59e0b; padding: 14px; border-radius: 12px; margin: 15px 0; color: #92400e; font-weight: 600; }

    .action-bar { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .chart-container { max-width: 100%; margin: 25px 0; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); }
    canvas { max-width: 100%; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { position: relative; width: 100%; padding: 15px; }
      .content { margin-right: 0; padding: 15px; }
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ========== الشريط الجانبي ========== -->
    <nav class="sidebar" id="sidebar">
      <div class="logo">
        <span class="icon">📜</span>
        <h2>Caeser of History</h2>
        <p>إدارة المجموعات التعليمية</p>
      </div>

      <div style="flex:1;">
        <button class="nav-btn active" onclick="navigateTo('dashboard')"><span class="nav-icon">🏠</span> الرئيسية</button>
        <button class="nav-btn" onclick="navigateTo('students')"><span class="nav-icon">👨‍🎓</span> الطلاب</button>
        <button class="nav-btn" onclick="navigateTo('groups')"><span class="nav-icon">👥</span> المجموعات</button>
        <button class="nav-btn" onclick="navigateTo('attendance')"><span class="nav-icon">📋</span> الحضور</button>
        <button class="nav-btn" onclick="navigateTo('payments')"><span class="nav-icon">💰</span> المدفوعات</button>
        <button class="nav-btn" onclick="navigateTo('exams')"><span class="nav-icon">📝</span> الامتحانات</button>
        <button class="nav-btn" onclick="navigateTo('reports')"><span class="nav-icon">📊</span> التقارير</button>
      </div>

      <div class="bottom-actions">
        <button class="btn-gdrive" onclick="saveToGoogleDrive()">📤 حفظ في Google Drive</button>
        <button class="btn-gdrive" onclick="loadFromGoogleDrive()" style="background:#34a853;">📥 تحميل من Google Drive</button>
        <button class="btn-export" onclick="exportAllData()">💾 تصدير JSON</button>
        <button class="btn-import" onclick="document.getElementById('import-file').click()">📂 استيراد JSON</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importAllData(event)">
        <button class="btn-theme" onclick="toggleTheme()">🌓 تبديل المظهر</button>
      </div>
    </nav>

    <!-- ========== المحتوى ========== -->
    <main id="main-content" class="content"></main>
  </div>

  <script>
    // ==================== GOOGLE DRIVE API ====================
    const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com'; // هتحتاج تسجل تطبيق في Google Cloud
    const API_KEY = 'YOUR_API_KEY';
    const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let gapiLoaded = false;
    let gisLoaded = false;

    // تحميل Google API
    function loadGoogleAPI() {
      const script1 = document.createElement('script');
      script1.src = 'https://apis.google.com/js/api.js';
      script1.onload = () => { gapiLoaded = true; gapi.load('client', initializeGapiClient); };
      document.body.appendChild(script1);

      const script2 = document.createElement('script');
      script2.src = 'https://accounts.google.com/gsi/client';
      script2.onload = () => { gisLoaded = true; };
      document.body.appendChild(script2);
    }

    async function initializeGapiClient() {
      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: DISCOVERY_DOCS,
      });
    }

    // حفظ الملف في Google Drive
    async function saveToGoogleDrive() {
      if (!gapiLoaded || !gisLoaded) {
        alert('⏳ جاري تحميل Google API... حاول مرة أخرى.');
        loadGoogleAPI();
        return;
      }

      const token = await getGoogleToken();
      if (!token) return;

      const allData = {
        students: getStudents(),
        groups: getGroups(),
        attendance: getAttendance(),
        payments: getPayments(),
        exams: getExams()
      };

      const jsonStr = JSON.stringify(allData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });

      const metadata = {
        name: 'caeser_backup_' + new Date().toISOString().slice(0,10) + '.json',
        mimeType: 'application/json'
      };

      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', blob);

      try {
        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: form
        });
        const result = await response.json();
        if (result.id) {
          alert('✅ تم الحفظ في Google Drive بنجاح!\nرابط الملف: https://drive.google.com/file/d/' + result.id + '/view');
        } else {
          alert('❌ فشل الحفظ: ' + JSON.stringify(result));
        }
      } catch (err) {
        alert('❌ خطأ: ' + err.message);
      }
    }

    // تحميل من Google Drive
    async function loadFromGoogleDrive() {
      if (!gapiLoaded || !gisLoaded) {
        alert('⏳ جاري تحميل Google API... حاول مرة أخرى.');
        loadGoogleAPI();
        return;
      }

      const token = await getGoogleToken();
      if (!token) return;

      try {
        // جلب قائمة الملفات
        const response = await fetch('https://www.googleapis.com/drive/v3/files?q=name+contains+%22caeser_backup%22&orderBy=createdTime+desc&pageSize=5&fields=files(id,name,createdTime)', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();

        if (!data.files || data.files.length === 0) {
          alert('❌ لا توجد ملفات نسخ احتياطي في Google Drive.');
          return;
        }

        // عرض الملفات للاختيار
        let fileList = 'اختر ملف:\n\n';
        data.files.forEach((f, i) => {
          fileList += (i+1) + '- ' + f.name + ' (' + new Date(f.createdTime).toLocaleDateString('ar-EG') + ')\n';
        });
        const choice = prompt(fileList);
        if (!choice) return;

        const fileIndex = parseInt(choice) - 1;
        if (fileIndex < 0 || fileIndex >= data.files.length) return;

        const fileId = data.files[fileIndex].id;

        // تحميل محتوى الملف
        const contentResponse = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const jsonData = await contentResponse.json();

        if (jsonData.students) saveStudents(jsonData.students);
        if (jsonData.groups) saveGroups(jsonData.groups);
        if (jsonData.attendance) saveAttendance(jsonData.attendance);
        if (jsonData.payments) savePayments(jsonData.payments);
        if (jsonData.exams) saveExams(jsonData.exams);

        alert('✅ تم تحميل البيانات من Google Drive بنجاح!');
        navigateTo('dashboard');
      } catch (err) {
        alert('❌ خطأ: ' + err.message);
      }
    }

    async function getGoogleToken() {
      return new Promise((resolve) => {
        const tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (response) => {
            if (response.error) {
              alert('❌ فشل المصادقة: ' + response.error);
              resolve(null);
            } else {
              resolve(response.access_token);
            }
          },
        });
        tokenClient.requestAccessToken();
      });
    }

    // ==================== DATA LAYER ====================
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
    function getData(key) { const d = localStorage.getItem('caeser_' + key); return d ? JSON.parse(d) : []; }
    function saveData(key, data) { localStorage.setItem('caeser_' + key, JSON.stringify(data)); }
    function getStudents() { return getData('students'); }
    function saveStudents(s) { saveData('students', s); }
    function getStudentById(id) { return getStudents().find(s => s.id === id); }
    function getGroups() { return getData('groups'); }
    function saveGroups(g) { saveData('groups', g); }
    function getGroupById(id) { return getGroups().find(g => g.id === id); }
    function getAttendance() { return getData('attendance'); }
    function saveAttendance(a) { saveData('attendance', a); }
    function getPayments() { return getData('payments'); }
    function savePayments(p) { saveData('payments', p); }
    function getExams() { return getData('exams'); }
    function saveExams(e) { saveData('exams', e); }

    // ==================== تصدير/استيراد JSON ====================
    function exportAllData() {
      const d = { students: getStudents(), groups: getGroups(), attendance: getAttendance(), payments: getPayments(), exams: getExams() };
      const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'caeser_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
      alert('✅ تم التصدير');
    }
    function importAllData(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = function(ev) {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.students) saveStudents(d.students);
          if (d.groups) saveGroups(d.groups);
          if (d.attendance) saveAttendance(d.attendance);
          if (d.payments) savePayments(d.payments);
          if (d.exams) saveExams(d.exams);
          alert('✅ تم الاستيراد'); navigateTo('dashboard');
        } catch(er) { alert('❌ فشل'); }
      };
      r.readAsText(f);
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // ==================== المظهر ====================
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('caeser_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('caeser_theme') === 'dark') document.body.classList.add('dark-mode');

    // ==================== التنقل ====================
    function navigateTo(page) {
      const fn = window['load' + page.charAt(0).toUpperCase() + page.slice(1)];
      if (fn) fn();
      // تحديث الـ active
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(b => {
        if (b.textContent.includes(getPageTitle(page))) b.classList.add('active');
      });
    }
    function getPageTitle(page) {
      const titles = { dashboard: 'الرئيسية', students: 'الطلاب', groups: 'المجموعات', attendance: 'الحضور', payments: 'المدفوعات', exams: 'الامتحانات', reports: 'التقارير' };
      return titles[page] || '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadGoogleAPI();
      navigateTo('dashboard');
    });

    // ==================== داشبورد ====================
    function loadDashboard() {
      const m = document.getElementById('main-content');
      const st = getStudents(), gr = getGroups(), att = getAttendance(), pay = getPayments(), ex = getExams();
      const today = new Date().toISOString().slice(0,10);
      const present = att.filter(a => a.date === today && a.status === 'present').length;
      const total = pay.reduce((s,p) => s + p.amount, 0);
      const over = st.filter(s => pay.filter(p => p.studentId === s.id).length === 0);

      let h = `
        <div class="dashboard-header">
          <h1>👋 أهلاً بك في Caeser of History</h1>
          <p>لوحة تحكم إدارة المجموعات - كل شيء في مكان واحد</p>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon blue">👨‍🎓</div><div class="stat-info"><div class="stat-value">${st.length}</div><div class="stat-label">إجمالي الطلاب</div></div></div>
          <div class="stat-card"><div class="stat-icon green">👥</div><div class="stat-info"><div class="stat-value">${gr.length}</div><div class="stat-label">المجموعات</div></div></div>
          <div class="stat-card"><div class="stat-icon orange">📋</div><div class="stat-info"><div class="stat-value">${present}</div><div class="stat-label">حضور اليوم</div></div></div>
          <div class="stat-card"><div class="stat-icon purple">💰</div><div class="stat-info"><div class="stat-value">${total} ج.م</div><div class="stat-label">إجمالي المدفوعات</div></div></div>
        </div>`;
      if (over.length) h += `<div class="alert-box">⚠️ تنبيه: ${over.length} طلاب لم يسددوا بعد - ${over.map(s=>s.name).join('، ')}</div>`;
      h += `<div class="dashboard-grid">
        <div class="dash-card" onclick="navigateTo('students')"><span class="card-icon">👨‍🎓</span><div class="card-title">الطلاب</div><div class="card-subtitle">${st.length} طالب مسجل</div></div>
        <div class="dash-card" onclick="navigateTo('groups')"><span class="card-icon">👥</span><div class="card-title">المجموعات</div><div class="card-subtitle">${gr.length} مجموعة</div></div>
        <div class="dash-card" onclick="navigateTo('attendance')"><span class="card-icon">📋</span><div class="card-title">الحضور والغياب</div><div class="card-subtitle">${present} حاضر اليوم</div></div>
        <div class="dash-card" onclick="navigateTo('payments')"><span class="card-icon">💰</span><div class="card-title">المدفوعات</div><div class="card-subtitle">${total} جنيه</div></div>
        <div class="dash-card" onclick="navigateTo('exams')"><span class="card-icon">📝</span><div class="card-title">الامتحانات</div><div class="card-subtitle">${ex.length} امتحان</div></div>
        <div class="dash-card" onclick="navigateTo('reports')"><span class="card-icon">📊</span><div class="card-title">التقارير</div><div class="card-subtitle">إحصائيات شاملة</div></div>
      </div>`;
      m.innerHTML = h;
    }

    // ==================== الطلاب ====================
    function loadStudents() {
      const m = document.getElementById('main-content');
      const gr = getGroups();
      let h = `
        <div class="page-container">
          <div class="page-header"><h2>👨‍🎓 إدارة الطلاب</h2><div class="search-box"><input type="text" id="ss" placeholder="🔍 بحث عن طالب..." oninput="filterStudents()"></div></div>
