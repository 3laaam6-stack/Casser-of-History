<script>
// ==================== DATA LAYER ====================
const PF = 'caeser_';
function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function get(k) { return JSON.parse(localStorage.getItem(PF + k) || '[]'); }
function set(k, v) { localStorage.setItem(PF + k, JSON.stringify(v)); }
const students = () => get('students'), saveStudents = (v) => set('students', v), studentById = (id) => students().find(s => s.id === id);
const groups = () => get('groups'), saveGroups = (v) => set('groups', v), groupById = (id) => groups().find(g => g.id === id);
const attendance = () => get('attendance'), saveAttendance = (v) => set('attendance', v);
const payments = () => get('payments'), savePayments = (v) => set('payments', v);
const exams = () => get('exams'), saveExams = (v) => set('exams', v);
const storeFiles = () => get('store'), saveStore = (v) => set('store', v);
const activityLog = () => get('activity'), saveActivity = (v) => set('activity', v);
const notifications = () => get('notifications'), saveNotifications = (v) => set('notifications', v);

function fileToBase64(file) { return new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); }); }
function shareText(text) { if (navigator.share) navigator.share({ title: 'Caeser', text }); else window.open('https://wa.me/?text=' + encodeURIComponent(text)); }
function logActivity(action) { const log = activityLog(); log.push({ id: gid(), action, time: new Date().toISOString() }); if (log.length > 100) log.splice(0, 20); saveActivity(log); }
function addNotification(msg) { const n = notifications(); n.push({ id: gid(), msg, seen: false }); saveNotifications(n); }
function printDiv(html) { const win = window.open('', '_blank'); win.document.write('<html><head><style>body{font-family:Tahoma;direction:rtl;padding:20px;}table{width:100%;border-collapse:collapse;}td,th{border:1px solid #ddd;padding:8px;}</style></head><body>' + html + '</body></html>'); win.print(); }

// ==================== QR CODE ====================
function generateQR(text, elementId) {
  const el = document.getElementById(elementId); if (!el) return;
  el.innerHTML = '';
  const size = 200, canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  const moduleCount = 21, moduleSize = size / moduleCount;
  function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash); }
  const hash = hashCode(text);
  const random = (seed) => { let s = seed; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s % 2 === 0; }; };
  const rng = random(hash);
  ctx.fillStyle = '#000000';
  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if ((row < 7 && col < 7) || (row < 7 && col > moduleCount - 8) || (row > moduleCount - 8 && col < 7)) {
        if ((row === 0 || row === 6 || col === 0 || col === 6) || (row >= 2 && row <= 4 && col >= 2 && col <= 4)) {
          ctx.fillRect(col * moduleSize, row * moduleSize, moduleSize, moduleSize);
        }
      } else if (rng()) { ctx.fillRect(col * moduleSize, row * moduleSize, moduleSize, moduleSize); }
    }
  }
  el.appendChild(canvas);
}
function showQR(id) {
  const s = studentById(id); if (!s) return;
  const existing = document.querySelector('.qr-modal'); if (existing) existing.remove();
  const modal = document.createElement('div'); modal.className = 'qr-modal';
  modal.innerHTML = `<div class="qr-modal-content"><h3>📱 ${s.name}</h3><div id="qr-container"></div><p style="margin:10px 0;">📞 ${s.phone}</p><button class="btn btn-back" onclick="this.closest('.qr-modal').remove()">❌ إغلاق</button></div>`;
  document.body.appendChild(modal);
  setTimeout(() => generateQR(`الطالب: ${s.name}\nالهاتف: ${s.phone}`, 'qr-container'), 100);
}

// ==================== TEMPLATES ====================
function sendTemplate(template, studentId) {
  const s = studentById(studentId); if (!s) return;
  const templates = {
    reminder: '📚 تذكير: موعد الحصة غداً إن شاء الله. أستاذ التاريخ.',
    exam: '📝 نتيجة امتحانك جاهزة، يمكنك مراجعتها في أي وقت.',
    payment: '💰 تذكير بدفع الرسوم الشهرية، جزاك الله خيراً.',
    thanks: '🌟 شكراً على اجتهادك وتميزك، وفقك الله!'
  };
  const msg = templates[template] || '';
  window.open('https://wa.me/' + s.phone.replace(/[^0-9]/g,'') + '?text=' + encodeURIComponent(msg), '_blank');
  logActivity('قالب واتساب: ' + template + ' -> ' + s.name);
}

// ==================== EXPORT/IMPORT ====================
function exportAllData() {
  const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles(), activity: activityLog() };
  const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'caeser_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  alert('✅ تم التصدير'); logActivity('تصدير البيانات');
}
function importAllData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = function(ev) {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.students) saveStudents(d.students); if (d.groups) saveGroups(d.groups);
      if (d.attendance) saveAttendance(d.attendance); if (d.payments) savePayments(d.payments);
      if (d.exams) saveExams(d.exams); if (d.store) saveStore(d.store); if (d.activity) saveActivity(d.activity);
      alert('✅ تم الاستيراد'); logActivity('استيراد البيانات'); navigateTo('dashboard');
    } catch(er) { alert('❌ فشل'); }
  };
  r.readAsText(f);
}

// ==================== AUTO BACKUP ====================
setInterval(() => {
  const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles() };
  set('auto_backup', d);
}, 60000);

// ==================== NAVIGATION ====================
function navigateTo(page) {
  const fn = window['load' + page.charAt(0).toUpperCase() + page.slice(1)];
  if (fn) fn();
  document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
  const titles = { dashboard: 'الرئيسية', students: 'الطلاب', groups: 'المجموعات', attendance: 'الحضور', payments: 'المدفوعات', exams: 'الامتحانات', store: 'المخزن', reports: 'التقارير' };
  document.querySelectorAll('.sidebar nav button').forEach(b => { if (b.textContent.includes(titles[page]||'')) b.classList.add('active'); });
}
window.addEventListener('DOMContentLoaded', () => navigateTo('dashboard'));

// ==================== DASHBOARD ====================
function loadDashboard() {
  const m = document.getElementById('main-content');
  const st = students(), gr = groups(), att = attendance(), pay = payments(), ex = exams(), sf = storeFiles();
  const today = new Date().toISOString().slice(0,10);
  const pres = att.filter(a => a.date === today && a.status === 'present').length;
  const tot = pay.reduce((s,p) => s + p.amount, 0);
  const ov = st.filter(s => pay.filter(p => p.studentId === s.id).length === 0);
  const notifs = notifications().filter(n => !n.seen).slice(-4);

  let h = `<div class="dash-header"><h1>👋 أهلاً بك</h1><p>Caeser of History - لوحة التحكم الرئيسية</p></div>
    <div class="stats-row">
      <div class="stat-card"><div class="sicon" style="background:#dbeafe;">👨‍🎓</div><div><div class="sval">${st.length}</div><div class="slbl">إجمالي الطلاب</div></div></div>
      <div class="stat-card"><div class="sicon" style="background:#d1fae5;">👥</div><div><div class="sval">${gr.length}</div><div class="slbl">المجموعات</div></div></div>
      <div class="stat-card"><div class="sicon" style="background:#fef3c7;">📋</div><div><div class="sval">${pres}</div><div class="slbl">حضور اليوم</div></div></div>
      <div class="stat-card"><div class="sicon" style="background:#ede9fe;">💰</div><div><div class="sval">${tot} ج.م</div><div class="slbl">المدفوعات</div></div></div>
      <div class="stat-card"><div class="sicon" style="background:#fce7f3;">🔔</div><div><div class="sval">${notifs.length}</div><div class="slbl">إشعارات جديدة</div></div></div>
    </div>`;
  if (ov.length) h += `<div class="alert">⚠️ ${ov.length} طلاب لم يسددوا بعد: ${ov.map(s=>s.name).join('، ')}</div>`;

function filterStudentList() {
  let list = students();
  const g = document.getElementById('filterGroup')?.value, p = document.getElementById('filterPayment')?.value, a = document.getElementById('filterAttendance')?.value;

  if (a === 'high') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length && (att.filter(x=>x.status==='present').length/att.length) >= 0.7; });
  if (a === 'low') list = list.filter(s => { const att = attendance().filter(x => x.studentId === s.id); return att.length === 0 || (att.filter(x=>x.status==='present').length/att.length) < 0.7; });
  const q = document.getElementById('ss')?.value.toLowerCase();
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.phone.includes(q));
  return list;

function loadAttendance() {
  const m = document.getElementById('main-content'), gr = groups();
  let h = `<div class="page"><h2>📋 الحضور والغياب</h2>
    <div style="display:flex;gap:12px;margin-bottom:20px;"><select id="ag"><option value="">-- المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><input type="date" id="ad"><button class="btn btn-view" onclick="showAttendance()">📅 عرض</button></div>
    <div id="attf"></div><h3 style="margin-top:24px;">📅 سجل الحضور السابق</h3><div id="atth"></div></div>`;
  m.innerHTML = h; renderAttHistory();
}
function showAttendance() {
  const gid2 = document.getElementById('ag').value, date = document.getElementById('ad').value;
  if (!gid2 || !date) return alert('اختر المجموعة والتاريخ');
  const st = students().filter(s => s.groupId === gid2);
  if (!st.length) return document.getElementById('attf').innerHTML = '<p>لا يوجد طلاب</p>';
  const ex = attendance().filter(a => a.groupId === gid2 && a.date === date);
  const map = {}; ex.forEach(a => map[a.studentId] = a.status);
  let f = '<form id="saf"><table><thead><tr><th>الطالب</th><th>حاضر</th><th>غائب</th></tr></thead><tbody>';
  st.forEach(s => f += `<tr><td>${s.name}</td><td><input type="radio" name="a-${s.id}" value="present" ${map[s.id]!=='absent'?'checked':''}></td><td><input type="radio" name="a-${s.id}" value="absent" ${map[s.id]==='absent'?'checked':''}></td></tr>`);
  f += '</tbody></table><div class="act-bar"><button type="submit" class="btn btn-save">💾 حفظ الحضور</button></div></form>';
  document.getElementById('attf').innerHTML = f;
  document.getElementById('saf').onsubmit = function(e) {
    e.preventDefault();
    let all = attendance().filter(a => !(a.groupId === gid2 && a.date === date));
    st.forEach(s => { const r = document.querySelector('input[name="a-' + s.id + '"]:checked'); if (r) all.push({ id: gid(), studentId: s.id, groupId: gid2, date, status: r.value }); });
    saveAttendance(all); logActivity('تسجيل حضور'); addNotification('📋 تم تسجيل الحضور');
    loadAttendance();
  };
}
function renderAttHistory() {
  const all = attendance(), atth = document.getElementById('atth');
  if (!atth) return;
  if (!all.length) return atth.innerHTML = '<p>لا يوجد سجل حضور بعد</p>';
  const grouped = {};
  all.forEach(a => { const k = a.date + a.groupId; if (!grouped[k]) grouped[k] = { date: a.date, groupId: a.groupId, present: 0, absent: 0 }; a.status === 'present' ? grouped[k].present++ : grouped[k].absent++; });
  let t = '<table><thead><tr><th>التاريخ</th><th>المجموعة</th><th>حضور</th><th>غياب</th></tr></thead><tbody>';
  Object.values(grouped).forEach(r => { const g = groupById(r.groupId); t += `<tr><td>${r.date}</td><td>${g?g.name:'—'}</td><td>${r.present}</td><td>${r.absent}</td></tr>`; });
  t += '</tbody></table>'; atth.innerHTML = t;
}

// ==================== STORE ====================
function loadStore() {
  const m = document.getElementById('main-content'), files = storeFiles();
  let h = `<div class="page"><h2>🗄️ المخزن</h2>
    <form id="storef">
      <label class="file-label" for="sfile">📤 اختر ملفات</label>
      <input type="file" id="sfile" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.gif" multiple onchange="document.getElementById('sfname').textContent = this.files.length + ' ملفات'">
      <span id="sfname" style="font-size:15px;color:var(--text-light);"></span>
      <button type="submit">⬆️ رفع للمخزن</button>
    </form>
    <div class="store-grid">`;
  if (!files.length) h += '<p style="text-align:center;padding:40px;">لا توجد ملفات في المخزن</p>';
  files.forEach(f => {
    const icon = f.type === 'pdf' ? '📄' : f.type === 'doc' ? '📝' : f.type === 'ppt' ? '📊' : '🖼️';
    h += `<div class="store-card"><div class="file-icon">${icon}</div><div class="file-name">${f.name}</div><div class="file-date">${f.date}</div>
    <div class="file-actions"><a href="${f.data}" download="${f.name}" class="btn btn-download">📥 تحميل</a><button class="btn btn-wa" onclick="shareFile('${f.id}')">📱 واتساب</button><button class="btn btn-del" onclick="deleteStoreFile('${f.id}')">🗑️</button></div></div>`;
  });
  h += '</div></div>'; m.innerHTML = h;
  document.getElementById('storef').onsubmit = async function(e) {
    e.preventDefault();
    const fi = document.getElementById('sfile');
    if (!fi.files.length) return alert('اختر ملفات');
    const newFiles = [...storeFiles()];
    for (const file of fi.files) {
      if (file.size > 10*1024*1024) { alert(file.name + ' كبير جداً'); continue; }
      const ext = file.name.split('.').pop().toLowerCase();
      const type = ext === 'pdf' ? 'pdf' : ['doc','docx'].includes(ext) ? 'doc' : ['ppt','pptx'].includes(ext) ? 'ppt' : 'image';
      newFiles.push({ id: gid(), name: file.name, type, date: new Date().toISOString().slice(0,10), data: await fileToBase64(file) });
    }
    saveStore(newFiles); logActivity('رفع ملفات للمخزن'); addNotification('🗄️ تم رفع ملفات للمخزن'); loadStore();
  };
}
function shareFile(id) { const f = storeFiles().find(x => x.id === id); if (f) shareText(`📁 ${f.name}\n📅 ${f.date}\n---\nCaeser of History`); }
function deleteStoreFile(id) { if (!confirm('حذف الملف؟')) return; saveStore(storeFiles().filter(f => f.id !== id)); logActivity('حذف ملف من المخزن'); loadStore(); }

// ==================== REPORTS ====================
function loadReports() {
  const m = document.getElementById('main-content');
  const st = students(), att = attendance(), pay = payments(), ex = exams(), gr = groups();
  let h = `<div class="page"><h2>📊 التقارير والإحصائيات</h2>`;
  if (gr.length > 0) {
    h += `<div class="chart-wrap"><h3>👥 توزيع الطلاب على المجموعات</h3><canvas id="groupChart" height="80"></canvas></div>`;
    setTimeout(() => {
      const ctx = document.getElementById('groupChart');
      if (ctx) new Chart(ctx, { type: 'bar', data: { labels: gr.map(g => g.name), datasets: [{ label: 'عدد الطلاب', data: gr.map(g => st.filter(s => s.groupId === g.id).length), backgroundColor: ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#ec4899'] }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
    }, 100);
  }
  h += `<div class="act-bar"><button class="btn btn-print" onclick="printReports()">🖨️ طباعة التقرير</button></div>`;
  h += `<h3 style="margin-top:22px;">📋 ملخص الطلاب</h3><table><thead><tr><th>الطالب</th><th>المجموعة</th><th>حضور%</th><th>مدفوعات</th><th>متوسط</th><th>نقاط</th></tr></thead><tbody>`;
  st.forEach(s => {
    const g = groupById(s.groupId), a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length;
    const pct = a.length ? Math.round((pr/a.length)*100) : 0, tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0);
    const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0;
    h += `<tr><td>${s.name}</td><td>${g?g.name:'—'}</td><td>${pct}%</td><td>${tot} ج.م</td><td>${avg}</td><td><span class="points">⭐ ${s.points||0}</span></td></tr>`;
  });
  h += '</tbody></table><h3 style="margin-top:22px;">👥 ملخص المجموعات</h3><table><thead><tr><th>المجموعة</th><th>الطلاب</th><th>متوسط الحضور</th></tr></thead><tbody>';
  gr.forEach(g => {
    const gs = st.filter(s => s.groupId === g.id); if (!gs.length) return;
    let tp = 0; gs.forEach(s => { const a = att.filter(x => x.studentId === s.id); tp += a.length ? (a.filter(x=>x.status==='present').length/a.length)*100 : 0; });
    h += `<tr><td>${g.name}</td><td>${gs.length}</td><td>${(tp/gs.length).toFixed(1)}%</td></tr>`;
  });
  h += '</tbody></table></div>'; m.innerHTML = h;
}
function printReports() {
  const st = students(), att = attendance(), pay = payments(), ex = exams(), gr = groups();
  let html = '<h2>تقرير Caeser of History</h2><h3>ملخص الطلاب</h3><table><tr><th>الطالب</th><th>المجموعة</th><th>حضور%</th><th>مدفوعات</th><th>متوسط</th><th>نقاط</th></tr>';
  st.forEach(s => {
    const g = groupById(s.groupId), a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length;
    const pct = a.length ? Math.round((pr/a.length)*100) : 0, tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0);
    const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0;
    html += `<tr><td>${s.name}</td><td>${g?g.name:'—'}</td><td>${pct}%</td><td>${tot} ج.م</td><td>${avg}</td><td>${s.points||0}</td></tr>`;
  });
  html += '</table>'; printDiv(html);
}
</script>
</body>
</html>
