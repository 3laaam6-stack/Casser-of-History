  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text-light: #64748b;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
    @keyframes bounceIn { 0%{opacity:0;transform:scale(0.3);} 50%{opacity:1;transform:scale(1.05);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes notificationOut { 0%{opacity:1;max-height:100px;margin-bottom:6px;} 100%{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;} }

    .animate-fadeInUp { animation: fadeInUp 0.5s ease-out; }
    .animate-scaleIn { animation: scaleIn 0.4s ease-out; }
    .animate-bounceIn { animation: bounceIn 0.6s ease-out; }

    .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; } .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; } .stagger-5 { animation-delay: 0.25s; } .stagger-6 { animation-delay: 0.3s; }
    .stagger-7 { animation-delay: 0.35s; } .stagger-8 { animation-delay: 0.4s; } .stagger-9 { animation-delay: 0.45s; }

    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: linear-gradient(180deg, #0f172a, #1e293b); color: #fff;

    .sidebar .logo h2 { font-size: 28px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }

    .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

    @media (max-width: 1024px) { :root { --sidebar-w: 300px; } .stats-row { grid-template-columns: repeat(3, 1fr); } .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .app-container { flex-direction: column; } .sidebar { position: relative; width: 100%; min-width: 100%; } .content { margin-right: 0; padding: 14px; } .stats-row, .grid, .store-grid, .hall-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>

<div class="app-container">

<script>
// ==================== DATA ====================
const PF = 'caeser_';
function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function get(k) { return JSON.parse(localStorage.getItem(PF + k) || '[]'); }
function set(k, v) { localStorage.setItem(PF + k, JSON.stringify(v)); }
const students = () => get('students'), saveStudents = (v) => set('students', v), studentById = (id) => students().find(s => s.id === id);
const groups = () => get('groups'), saveGroups = (v) => set('groups', v), groupById = (id) => groups().find(g => g.id === id);
const attendance = () => get('attendance'), saveAttendance = (v) => set('attendance', v);
const payments = () => get('payments'), savePayments = (v) => set('payments', v);
const exams = () => get('exams'), saveExams = (v) => set('exams', v);
const storeFiles = () => get('store'), saveStore = (v) => set('store', v);
const activityLog = () => get('activity'), saveActivity = (v) => set('activity', v);
const notifications = () => get('notifications'), saveNotifications = (v) => set('notifications', v);
const schedule = () => get('schedule'), saveSchedule = (v) => set('schedule', v);

// Default schedule
const DEFAULT_SCHEDULE = {
  'الجمعة': [], 'السبت': [], 'الأحد': [], 'الإثنين': [], 'الثلاثاء': [], 'الأربعاء': [], 'الخميس': []
};
if (!localStorage.getItem(PF + 'schedule')) saveSchedule(DEFAULT_SCHEDULE);

function fileToBase64(file) { return new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); }); }
function shareText(text) { if (navigator.share) navigator.share({ title: 'Caeser', text }); else window.open('https://wa.me/?text=' + encodeURIComponent(text)); }
function logActivity(action) { const log = activityLog(); log.push({ id: gid(), action, time: new Date().toISOString() }); if (log.length > 100) log.splice(0, 20); saveActivity(log); }
function addNotification(msg) { const n = notifications(); n.push({ id: gid(), msg, seen: false, time: Date.now() }); saveNotifications(n); }
function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => { t.style.animation = 'slideDown 0.3s ease-out reverse'; setTimeout(() => t.remove(), 300); }, 2000); }
function printDiv(html) { const win = window.open('', '_blank'); win.document.write('<html><head><style>body{font-family:Tahoma;direction:rtl;padding:20px;}table{width:100%;border-collapse:collapse;}td,th{border:1px solid #ddd;padding:8px;}</style></head><body>' + html + '</body></html>'); win.print(); }
function dismissNotification(id, element) { element.classList.add('dismissing'); setTimeout(() => { const n = notifications(); const idx = n.findIndex(x => x.id === id); if (idx > -1) { n[idx].seen = true; saveNotifications(n); } if (element.parentNode) element.remove(); }, 400); }

// ==================== QR ====================
function generateQR(text, elementId) {
  const el = document.getElementById(elementId); if (!el) return;
  el.innerHTML = ''; const size = 200, canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  const mc = 21, ms = size / mc;
  function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash); }
  const hash = hashCode(text);
  const rng = (seed) => { let s = seed; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s % 2 === 0; }; };
  const random = rng(hash);
  ctx.fillStyle = '#000';
  for (let row = 0; row < mc; row++) for (let col = 0; col < mc; col++) { if ((row < 7 && col < 7) || (row < 7 && col > mc - 8) || (row > mc - 8 && col < 7)) { if ((row === 0 || row === 6 || col === 0 || col === 6) || (row >= 2 && row <= 4 && col >= 2 && col <= 4)) ctx.fillRect(col * ms, row * ms, ms, ms); } else if (random()) ctx.fillRect(col * ms, row * ms, ms, ms); }
  el.appendChild(canvas);
}
function showQR(id) { const s = studentById(id); if (!s) return; const existing = document.querySelector('.qr-modal'); if (existing) existing.remove(); const modal = document.createElement('div'); modal.className = 'qr-modal'; modal.innerHTML = `<div class="qr-modal-content"><h3>📱 ${s.name}</h3><div id="qr-container"></div><p style="margin:10px 0;">📞 ${s.phone}</p><button class="btn btn-back" onclick="this.closest('.qr-modal').remove()">❌ إغلاق</button></div>`; document.body.appendChild(modal); setTimeout(() => generateQR(`الطالب: ${s.name}\nالهاتف: ${s.phone}`, 'qr-container'), 100); }
function sendTemplate(template, studentId) { const s = studentById(studentId); if (!s) return; const templates = { reminder: '📚 تذكير: موعد الحصة غداً.', exam: '📝 نتيجة امتحانك جاهزة.', payment: '💰 تذكير بدفع الرسوم.', thanks: '🌟 شكراً على اجتهادك!' }; window.open('https://wa.me/' + s.phone.replace(/[^0-9]/g,'') + '?text=' + encodeURIComponent(templates[template] || ''), '_blank'); showToast('✅ تم فتح واتساب'); }

// ==================== EXPORT/IMPORT ====================
function exportAllData() { const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles(), schedule: schedule() }; const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'caeser_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click(); showToast('✅ تم التصدير'); }
function importAllData(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = function(ev) { try { const d = JSON.parse(ev.target.result); if (d.students) saveStudents(d.students); if (d.groups) saveGroups(d.groups); if (d.attendance) saveAttendance(d.attendance); if (d.payments) savePayments(d.payments); if (d.exams) saveExams(d.exams); if (d.store) saveStore(d.store); if (d.schedule) saveSchedule(d.schedule); showToast('✅ تم الاستيراد'); navigateTo('dashboard'); } catch(er) { alert('❌ فشل'); } }; r.readAsText(f); }
setInterval(() => { const d = { students: students(), groups: groups(), attendance: attendance(), payments: payments(), exams: exams(), store: storeFiles(), schedule: schedule() }; set('auto_backup', d); }, 60000);

function navigateTo(page) { const fn = window['load' + page.charAt(0).toUpperCase() + page.slice(1)]; if (fn) fn(); document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active')); const titles = { dashboard: 'الرئيسية', students: 'الطلاب', groups: 'المجموعات', attendance: 'الحضور', payments: 'المدفوعات', exams: 'الامتحانات', store: 'المخزن', halloffame: 'لوحة الشرف', reports: 'التقارير' }; document.querySelectorAll('.sidebar nav button').forEach(b => { if (b.textContent.includes(titles[page]||'')) b.classList.add('active'); }); }
window.addEventListener('DOMContentLoaded', () => navigateTo('dashboard'));

// ==================== DASHBOARD WITH SCHEDULE ====================
function loadDashboard() {
  const m = document.getElementById('main-content');
  const st = students(), gr = groups(), att = attendance(), pay = payments(), ex = exams(), sf = storeFiles();
  const today = new Date().toISOString().slice(0,10);
  const pres = att.filter(a => a.date === today && a.status === 'present').length;
  const tot = pay.reduce((s,p) => s + p.amount, 0);
  const ov = st.filter(s => pay.filter(p => p.studentId === s.id).length === 0);
  const notifs = notifications().filter(n => !n.seen).slice(-3);
  const sch = schedule();
  const DAYS = ['الجمعة', 'السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];

  let h = `<div class="dash-header"><h1>👋 أهلاً بك</h1><p>Caeser of History - لوحة التحكم</p></div>`;

  // Stats
  h += `<div class="stats-row">
    <div class="stat-card animate-fadeInUp"><div class="sicon" style="background:#dbeafe;">👨‍🎓</div><div><div class="sval">${st.length}</div><div class="slbl">طالب</div></div></div>
    <div class="stat-card animate-fadeInUp"><div class="sicon" style="background:#d1fae5;">👥</div><div><div class="sval">${gr.length}</div><div class="slbl">مجموعة</div></div></div>
    <div class="stat-card animate-fadeInUp"><div class="sicon" style="background:#fef3c7;">📋</div><div><div class="sval">${pres}</div><div class="slbl">حضور اليوم</div></div></div>
    <div class="stat-card animate-fadeInUp"><div class="sicon" style="background:#ede9fe;">💰</div><div><div class="sval">${tot} ج.م</div><div class="slbl">مدفوعات</div></div></div>
    <div class="stat-card animate-fadeInUp"><div class="sicon" style="background:#fce7f3;">🔔</div><div><div class="sval">${notifs.length}</div><div class="slbl">إشعارات</div></div></div>
  </div>`;

  if (ov.length) h += `<div class="alert">⚠️ ${ov.length} طلاب لم يسددوا: ${ov.map(s=>s.name).join('، ')}</div>`;
  
  // Notifications
  if (notifs.length > 0) { h += `<div style="margin-bottom:15px;">`; notifs.forEach(n => h += `<div class="notification" onclick="dismissNotification('${n.id}', this)">🔔 ${n.msg} <span style="margin-right:auto;font-size:11px;opacity:0.7;">${new Date(n.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div>`); h += `</div>`; }

  // Schedule Table
  h += `<h3 style="margin:20px 0 12px;">📅 جدول الأسبوع <button class="btn btn-edit" onclick="editScheduleDay()" style="font-size:12px;padding:4px 10px;">✏️ تعديل</button> <button class="btn btn-save" onclick="exportScheduleImage()" style="font-size:12px;padding:4px 10px;">📸 تصدير كصورة</button></h3>`;
  h += `<div id="schedule-container"><table class="schedule-table"><thead><tr>`;
  DAYS.forEach(d => h += `<th>${d}</th>`);
  h += `</tr></thead><tbody><tr>`;
  DAYS.forEach(d => {
    h += `<td><strong>${d}</strong>`;
    const items = sch[d] || [];
    if (items.length === 0) h += `<div class="schedule-item" style="color:#94a3b8;">—</div>`;
    else items.forEach(item => h += `<div class="schedule-item">🕐 ${item.time}<br>👥 ${item.group}<br>📚 ${item.subject||'تاريخ'}</div>`);
    h += `</td>`;
  });
  h += `</tr></tbody></table></div>`;

  // Dashboard Cards
  h += `<div class="grid" style="margin-top:24px;">
    <div class="dash-card" onclick="navigateTo('students')"><span class="ico">👨‍🎓</span><div class="ttl">الطلاب</div><div class="sub">${st.length} طالب</div></div>
    <div class="dash-card" onclick="navigateTo('groups')"><span class="ico">👥</span><div class="ttl">المجموعات</div><div class="sub">${gr.length} مجموعة</div></div>
    <div class="dash-card" onclick="navigateTo('attendance')"><span class="ico">📋</span><div class="ttl">الحضور</div><div class="sub">${pres} حاضر</div></div>
    <div class="dash-card" onclick="navigateTo('payments')"><span class="ico">💰</span><div class="ttl">المدفوعات</div><div class="sub">${tot} ج.م</div></div>
    <div class="dash-card" onclick="navigateTo('exams')"><span class="ico">📝</span><div class="ttl">الامتحانات</div><div class="sub">${ex.length} امتحان</div></div>
    <div class="dash-card" onclick="navigateTo('store')"><span class="ico">🗄️</span><div class="ttl">المخزن</div><div class="sub">${sf.length} ملف</div></div>
    <div class="dash-card" onclick="navigateTo('halloffame')"><span class="ico">🏆</span><div class="ttl">لوحة الشرف</div><div class="sub">الأفضل</div></div>
    <div class="dash-card" onclick="navigateTo('reports')"><span class="ico">📊</span><div class="ttl">التقارير</div><div class="sub">Excel/PDF</div></div>
  </div>`;
  m.innerHTML = h;
}

function editScheduleDay() {
  const sch = schedule();
  const DAYS = ['الجمعة', 'السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
  const day = prompt('اختر اليوم:\n' + DAYS.map((d,i) => (i+1)+'- '+d).join('\n'), '1');
  if (!day) return;
  const dayIndex = parseInt(day) - 1;
  if (dayIndex < 0 || dayIndex >= DAYS.length) return;
  const dayName = DAYS[dayIndex];
  const time = prompt('الوقت (مثال: 5:00 مساءً):', '');
  if (time === null) return;
  const group = prompt('المجموعة:', '');
  if (group === null) return;
  const subject = prompt('المادة:', 'تاريخ');
  if (subject === null) return;
  if (!sch[dayName]) sch[dayName] = [];
  if (time && group) {
    sch[dayName].push({ time, group, subject });
    saveSchedule(sch);
    showToast('✅ تمت إضافة الحصة');
    loadDashboard();
  }
}
async function exportScheduleImage() {
  const el = document.getElementById('schedule-container');
  if (!el) return;
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = 'schedule_' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ تم تصدير الجدول كصورة');
  } catch(e) { alert('فشل التصدير'); }
}

function loadStudents() {
  const m = document.getElementById('main-content'), gr = groups();
  let h = `<div class="page"><h2>👨‍🎓 الطلاب</h2>
    <div class="search"><input type="text" id="ss" placeholder="🔍 بحث..." oninput="renderStudentTable(filterStudentList())"></div>
    <div class="filter-bar">
      <select id="filterGroup" onchange="renderStudentTable(filterStudentList())"><option value="">كل المجموعات</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>
      <select id="filterPayment" onchange="renderStudentTable(filterStudentList())"><option value="">الدفع</option><option value="paid">سدد</option><option value="unpaid">لم يسدد</option></select>
    </div>
    <form id="sf"><input type="text" id="sn" placeholder="اسم الطالب" required><input type="tel" id="sp" placeholder="الهاتف" required><input type="tel" id="sg" placeholder="ولي الأمر"><select id="sgr"><option value="">-- المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><button type="submit">➕ إضافة</button></form>
    <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المجموعة</th><th>نقاط</th><th>QR</th><th>قالب</th><th>إجراءات</th></tr></thead><tbody id="stb"></tbody></table></div>`;
  m.innerHTML = h;
  renderStudentTable(students());
  document.getElementById('sf').onsubmit = function(e) { e.preventDefault(); const n = document.getElementById('sn').value.trim(), p = document.getElementById('sp').value.trim(); const g = document.getElementById('sg').value.trim(), gid2 = document.getElementById('sgr').value; if (!n || !p) return alert('الاسم والهاتف مطلوبان'); saveStudents([...students(), { id: gid(), name: n, phone: p, guardianPhone: g || null, groupId: gid2 || null, points: 0 }]); addNotification('👨‍🎓 طالب جديد: ' + n); loadStudents(); };
}
function filterStudentList() { let list = students(); const g = document.getElementById('filterGroup')?.value, p = document.getElementById('filterPayment')?.value; if (g) list = list.filter(s => s.groupId === g); if (p === 'paid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length > 0); if (p === 'unpaid') list = list.filter(s => payments().filter(x => x.studentId === s.id).length === 0); const q = document.getElementById('ss')?.value.toLowerCase(); if (q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.phone.includes(q)); return list; }
function renderStudentTable(list) { const gr = groups(), tbody = document.getElementById('stb'); if (!tbody) return; tbody.innerHTML = list.map(s => { const g = gr.find(x => x.id === s.groupId); return `<tr><td><strong>${s.name}</strong></td><td>${s.phone}</td><td>${g?g.name:'—'}</td><td><span class="points">⭐ ${s.points||0}</span></td><td><button class="btn btn-qr" onclick="showQR('${s.id}')">📱</button></td><td><button class="btn btn-template" onclick="showTemplates('${s.id}')">📋</button></td><td><button class="btn btn-view" onclick="viewStudent('${s.id}')">👁️</button><button class="btn btn-edit" onclick="editStudent('${s.id}')">✏️</button><button class="btn btn-del" onclick="deleteStudentFull('${s.id}')">🗑️</button></td></tr>`; }).join(''); }
function showTemplates(id) { const t = prompt('1- تذكير\n2- نتيجة\n3- دفع\n4- شكر', '1'); const map = { '1': 'reminder', '2': 'exam', '3': 'payment', '4': 'thanks' }; if (map[t]) sendTemplate(map[t], id); }
function editStudent(id) { const s = studentById(id); if (!s) return; const n = prompt('الاسم:', s.name); if (n === null) return; const p = prompt('الهاتف:', s.phone); if (p === null) return; const guard = prompt('ولي الأمر:', s.guardianPhone || ''); const gr = groups(); const c = prompt('رقم المجموعة:\n' + gr.map((x,i) => (i+1)+'-'+x.name).join('\n') + '\n(0=بدون)', s.groupId ? gr.findIndex(x=>x.id===s.groupId)+1 : '0'); let gid2 = null; if (c && parseInt(c) > 0 && gr[parseInt(c)-1]) gid2 = gr[parseInt(c)-1].id; const pts = parseInt(prompt('النقاط:', s.points||0)) || 0; const all = students(); all[all.findIndex(x=>x.id===id)] = { ...s, name: n, phone: p, guardianPhone: guard||null, groupId: gid2, points: pts }; saveStudents(all); loadStudents(); }
function deleteStudentFull(id) { if (!confirm('⚠️ حذف الطالب؟')) return; saveStudents(students().filter(s => s.id !== id)); saveAttendance(attendance().filter(a => a.studentId !== id)); savePayments(payments().filter(p => p.studentId !== id)); saveExams(exams().filter(e => e.studentId !== id)); loadStudents(); }
function viewStudent(id) { const s = studentById(id); if (!s) return; const g = groupById(s.groupId), att = attendance().filter(a => a.studentId === s.id); const pay = payments().filter(p => p.studentId === s.id), ex = exams().filter(e => e.studentId === s.id); const tot = pay.reduce((sum,p) => sum + p.amount, 0), pres = att.filter(a => a.status === 'present').length; const pct = att.length ? Math.round((pres/att.length)*100) : 0, avg = ex.length ? (ex.reduce((sm,e)=>sm+e.score,0)/ex.length).toFixed(1) : 0; document.getElementById('main-content').innerHTML = `<div class="page"><h2>📋 ${s.name}</h2><table><tr><td>📞</td><td>${s.phone}</td></tr><tr><td>👨‍👩‍👦</td><td>${s.guardianPhone||'—'}</td></tr><tr><td>👥</td><td>${g?g.name:'—'}</td></tr><tr><td>📊</td><td>${pct}%</td></tr><tr><td>💰</td><td>${tot} ج.م</td></tr><tr><td>📝</td><td>${avg}</td></tr></table><div class="act-bar"><button class="btn btn-share" onclick="shareStudent('${s.id}')">📤</button><button class="btn btn-qr" onclick="showQR('${s.id}')">📱</button><button class="btn btn-print" onclick="printStudent('${s.id}')">🖨️</button><button class="btn btn-back" onclick="loadStudents()">⬅️ رجوع</button></div></div>`; }

  let h = `<div class="page"><h2>👥 المجموعات</h2>
    <form id="gf"><input type="text" id="gn" placeholder="اسم المجموعة" required><input type="text" id="gs" placeholder="المواعيد"><input type="text" id="gcur" placeholder="وقفنا فين في المنهج"><button type="submit">➕ إضافة</button></form>
    <table><thead><tr><th>المجموعة</th><th>المواعيد</th><th>المنهج</th><th>الطلاب</th><th>واتساب</th><th>قالب</th><th>إجراءات</th></tr></thead><tbody>`;
  gr.forEach(g => {
    const cnt = st.filter(s => s.groupId === g.id).length;
    h += `<tr><td><strong>${g.name}</strong></td><td>${g.schedule||'—'}</td><td>${g.curriculum||'—'} <button class="btn btn-edit" onclick="editCurriculum('${g.id}')" style="font-size:10px;padding:2px 6px;">✏️</button></td><td>${cnt}</td>

  });
  h += '</tbody></table></div>'; m.innerHTML = h;
  document.getElementById('gf').onsubmit = function(e) { e.preventDefault(); const n = document.getElementById('gn').value.trim(); if (!n) return; saveGroups([...groups(), { id: gid(), name: n, schedule: document.getElementById('gs').value.trim(), curriculum: document.getElementById('gcur').value.trim() }]); addNotification('👥 مجموعة جديدة: ' + n); loadGroups(); };

function editCurriculum(id) { const g = groupById(id); if (!g) return; const cur = prompt('وقفنا فين في المنهج:', g.curriculum || ''); if (cur === null) return; const all = groups(); all[all.findIndex(x=>x.id===id)].curriculum = cur; saveGroups(all); showToast('✅ تم تحديث المنهج'); loadGroups(); }
function editGroup(id) { const g = groupById(id); if (!g) return; const n = prompt('الاسم:', g.name); if (n === null) return; const s = prompt('المواعيد:', g.schedule || ''); const cur = prompt('المنهج:', g.curriculum || ''); const all = groups(); all[all.findIndex(x=>x.id===id)] = { ...g, name: n, schedule: s, curriculum: cur }; saveGroups(all); loadGroups(); }
function deleteGroup(id) { if (!confirm('حذف؟')) return; saveGroups(groups().filter(g => g.id !== id)); saveStudents(students().map(s => s.groupId === id ? {...s, groupId: null} : s)); loadGroups(); }
function sendWhatsappGroup(gid2) { const st = students().filter(s => s.groupId === gid2); if (!st.length) return; const msg = prompt('الرسالة:'); if (!msg) return; st.forEach(s => { const p = s.phone.replace(/[^0-9]/g, ''); if (p) window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(msg), '_blank'); }); }
function sendTemplateGroup(gid2) { const st = students().filter(s => s.groupId === gid2); if (!st.length) return; const t = prompt('1- تذكير\n2- نتيجة\n3- دفع\n4- شكر', '1'); const map = { '1': 'reminder', '2': 'exam', '3': 'payment', '4': 'thanks' }; if (map[t]) st.forEach(s => sendTemplate(map[t], s.id)); }

// ==================== ATTENDANCE, PAYMENTS, EXAMS ====================
function loadAttendance() { const m = document.getElementById('main-content'), gr = groups(); let h = `<div class="page"><h2>📋 الحضور</h2><div style="display:flex;gap:12px;margin-bottom:20px;"><select id="ag"><option value="">-- المجموعة --</option>${gr.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><input type="date" id="ad"><button class="btn btn-view" onclick="showAttendance()">📅 عرض</button></div><div id="attf"></div><h3 style="margin-top:24px;">سجل</h3><div id="atth"></div></div>`; m.innerHTML = h; renderAttHistory(); }
function showAttendance() { const gid2 = document.getElementById('ag').value, date = document.getElementById('ad').value; if (!gid2 || !date) return; const st = students().filter(s => s.groupId === gid2); if (!st.length) return document.getElementById('attf').innerHTML = '<p>لا يوجد طلاب</p>'; const ex = attendance().filter(a => a.groupId === gid2 && a.date === date); const map = {}; ex.forEach(a => map[a.studentId] = a.status); let f = '<form id="saf"><table><thead><tr><th>الطالب</th><th>حاضر</th><th>غائب</th></tr></thead><tbody>'; st.forEach(s => f += `<tr><td>${s.name}</td><td><input type="radio" name="a-${s.id}" value="present" ${map[s.id]!=='absent'?'checked':''}></td><td><input type="radio" name="a-${s.id}" value="absent" ${map[s.id]==='absent'?'checked':''}></td></tr>`); f += '</tbody></table><button type="submit" class="btn btn-save" style="margin-top:10px;">💾 حفظ</button></form>'; document.getElementById('attf').innerHTML = f; document.getElementById('saf').onsubmit = function(e) { e.preventDefault(); let all = attendance().filter(a => !(a.groupId === gid2 && a.date === date)); st.forEach(s => { const r = document.querySelector('input[name="a-' + s.id + '"]:checked'); if (r) all.push({ id: gid(), studentId: s.id, groupId: gid2, date, status: r.value }); }); saveAttendance(all); addNotification('📋 تم تسجيل الحضور'); loadAttendance(); }; }
function renderAttHistory() { const all = attendance(), atth = document.getElementById('atth'); if (!atth) return; if (!all.length) return atth.innerHTML = '<p>لا سجل</p>'; const grouped = {}; all.forEach(a => { const k = a.date + a.groupId; if (!grouped[k]) grouped[k] = { date: a.date, groupId: a.groupId, present: 0, absent: 0 }; a.status === 'present' ? grouped[k].present++ : grouped[k].absent++; }); let t = '<table><tr><th>التاريخ</th><th>المجموعة</th><th>حضور</th><th>غياب</th></tr>'; Object.values(grouped).forEach(r => { const g = groupById(r.groupId); t += `<tr><td>${r.date}</td><td>${g?g.name:'—'}</td><td>${r.present}</td><td>${r.absent}</td></tr>`; }); t += '</table>'; atth.innerHTML = t; }

function loadPayments() { const m = document.getElementById('main-content'), st = students(), pay = payments(); let h = `<div class="page"><h2>💰 المدفوعات</h2><form id="pf"><select id="ps" required><option value="">-- الطالب --</option>${st.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><input type="number" id="pa" placeholder="المبلغ" required><input type="date" id="pd" required><input type="text" id="pn" placeholder="ملاحظات"><button type="submit">➕ إضافة</button></form><table><tr><th>الطالب</th><th>المبلغ</th><th>التاريخ</th><th>ملاحظات</th><th>حذف</th></tr>`; pay.forEach(p => { const s = st.find(x => x.id === p.studentId); h += `<tr><td>${s?s.name:'—'}</td><td>${p.amount} ج.م</td><td>${p.date}</td><td>${p.notes||''}</td><td><button class="btn btn-del" onclick="deletePayment('${p.id}')">🗑️</button></td></tr>`; }); if (!pay.length) h += '<tr><td colspan="5">لا توجد مدفوعات</td></tr>'; h += '</table></div>'; m.innerHTML = h; document.getElementById('pf').onsubmit = function(e) { e.preventDefault(); const sid = document.getElementById('ps').value, amt = parseFloat(document.getElementById('pa').value); const date = document.getElementById('pd').value, notes = document.getElementById('pn').value.trim(); if (!sid || isNaN(amt) || !date) return; savePayments([...payments(), { id: gid(), studentId: sid, amount: amt, date, notes }]); loadPayments(); }; }
function deletePayment(id) { if (!confirm('حذف؟')) return; savePayments(payments().filter(p => p.id !== id)); loadPayments(); }

function loadExams() { const m = document.getElementById('main-content'), st = students(), ex = exams(); let h = `<div class="page"><h2>📝 الامتحانات</h2><form id="ef"><select id="es" required><option value="">-- الطالب --</option>${st.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><input type="text" id="en" placeholder="اسم الامتحان" required><input type="number" id="esc" placeholder="الدرجة" required><input type="date" id="ed" required><label class="file-label" for="efile">📎 رفع ملف</label><input type="file" id="efile" accept=".pdf,image/*" onchange="document.getElementById('fname').textContent=this.files[0]?.name||''"><span id="fname"></span><button type="submit">➕ إضافة</button></form><table><tr><th>الطالب</th><th>الامتحان</th><th>الدرجة</th><th>التاريخ</th><th>ملف</th><th>حذف</th></tr>`; ex.forEach(e => { const s = st.find(x => x.id === e.studentId); const link = e.fileData ? `<a href="${e.fileData}" download="${e.fileName||'exam'}">📥</a>` : '—'; h += `<tr><td>${s?s.name:'—'}</td><td>${e.examName}</td><td>${e.score}</td><td>${e.date}</td><td>${link}</td><td><button class="btn btn-del" onclick="deleteExam('${e.id}')">🗑️</button></td></tr>`; }); if (!ex.length) h += '<tr><td colspan="6">لا توجد</td></tr>'; h += '</table></div>'; m.innerHTML = h; document.getElementById('ef').onsubmit = async function(e) { e.preventDefault(); const sid = document.getElementById('es').value, en = document.getElementById('en').value.trim(); const sc = parseInt(document.getElementById('esc').value), date = document.getElementById('ed').value; const fi = document.getElementById('efile'); if (!sid || !en || isNaN(sc) || !date) return; let fd = null, fn = null; if (fi.files[0]) { if (fi.files[0].size > 5*1024*1024) return alert('كبير'); fd = await fileToBase64(fi.files[0]); fn = fi.files[0].name; } saveExams([...exams(), { id: gid(), studentId: sid, examName: en, score: sc, date, fileData: fd, fileName: fn }]); loadExams(); }; }
function deleteExam(id) { if (!confirm('حذف؟')) return; saveExams(exams().filter(e => e.id !== id)); loadExams(); }

// ==================== STORE ====================
const STAGES = ['J4', 'J5', 'J6', 'M1', 'M2', 'M3', 'S1', 'S2', 'S3'];
const STAGE_ICONS = { 'J4': '🎒', 'J5': '📚', 'J6': '✏️', 'M1': '🔬', 'M2': '📐', 'M3': '🧮', 'S1': '📖', 'S2': '📝', 'S3': '🎓' };
const STAGE_COLORS = { 'J4': '#3b82f6', 'J5': '#10b981', 'J6': '#f59e0b', 'M1': '#ef4444', 'M2': '#8b5cf6', 'M3': '#ec4899', 'S1': '#6366f1', 'S2': '#14b8a6', 'S3': '#f97316' };
function loadStore() { const m = document.getElementById('main-content'), files = storeFiles(); let h = `<div class="page"><h2>🗄️ المخزن</h2><div class="store-grid">`; STAGES.forEach(stage => { const sf = files.filter(f => f.stage === stage); h += `<div class="store-stage-card" style="border-top:5px solid ${STAGE_COLORS[stage]};"><div class="stage-header"><div class="stage-title">${STAGE_ICONS[stage]} ${stage}</div><div>${sf.length} ملفات</div></div><div class="stage-files">`; if (!sf.length) h += '<div style="text-align:center;color:#94a3b8;padding:20px;">فارغ</div>'; else sf.forEach(f => { const icon = f.type === 'pdf'?'📄':f.type==='doc'?'📝':f.type==='ppt'?'📊':'🖼️'; h += `<div class="store-file-item"><div class="file-info"><span>${icon}</span><span class="file-name-text">${f.name}</span></div><div><button class="btn btn-rename" onclick="renameFile('${f.id}')">✏️</button><a href="${f.data}" download="${f.name}" class="btn btn-download">📥</a><button class="btn btn-wa" onclick="shareFile('${f.id}')">📱</button><button class="btn btn-del" onclick="deleteStoreFile('${f.id}')">🗑️</button></div></div>`; }); h += `</div><input type="file" id="si-${stage}" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.gif" multiple style="display:none" onchange="uploadToStage('${stage}', this)"><button class="upload-btn" onclick="document.getElementById('si-${stage}').click()">⬆️ رفع</button></div>`; }); h += '</div></div>'; m.innerHTML = h; }
async function uploadToStage(stage, input) { if (!input.files.length) return; const nf = [...storeFiles()]; for (const file of input.files) { if (file.size > 10*1024*1024) continue; const ext = file.name.split('.').pop().toLowerCase(); const type = ext === 'pdf'?'pdf':['doc','docx'].includes(ext)?'doc':['ppt','pptx'].includes(ext)?'ppt':'image'; nf.push({ id: gid(), name: file.name, type, stage, date: new Date().toISOString().slice(0,10), data: await fileToBase64(file) }); } saveStore(nf); showToast('✅ تم الرفع'); loadStore(); }
function renameFile(id) { const files = storeFiles(); const file = files.find(f => f.id === id); if (!file) return; const nn = prompt('الاسم الجديد:', file.name); if (!nn) return; files[files.findIndex(f=>f.id===id)].name = nn; saveStore(files); loadStore(); }
function shareFile(id) { const f = storeFiles().find(x => x.id === id); if (f) shareText(`📁 ${f.name}\n📚 ${f.stage}`); }
function deleteStoreFile(id) { if (!confirm('حذف؟')) return; saveStore(storeFiles().filter(f => f.id !== id)); loadStore(); }

// ==================== HALL OF FAME ====================
function loadHalloffame() {
  const m = document.getElementById('main-content');
  const st = students(), att = attendance(), ex = exams();
  const ranked = st.map(s => {
    const a = att.filter(x => x.studentId === s.id);
    const pct = a.length ? Math.round((a.filter(x=>x.status==='present').length/a.length)*100) : 0;
    const exm = ex.filter(x => x.studentId === s.id);
    const avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0;
    return { ...s, attendancePct: pct, avgScore: parseFloat(avg) || 0 };
  });

  const byAttendance = [...ranked].sort((a,b) => b.attendancePct - a.attendancePct).slice(0, 5);
  const byScore = [...ranked].sort((a,b) => b.avgScore - a.avgScore).slice(0, 5);
  const byPoints = [...st].sort((a,b) => (b.points||0) - (a.points||0)).slice(0, 5);

  let h = `<div class="page"><h2>🏆 لوحة الشرف</h2>`;
  h += `<h3>📋 أفضل حضور</h3><div class="hall-grid">`;
  byAttendance.forEach((s, i) => h += `<div class="hall-card"><div class="rank rank-${i+1}">#${i+1}</div><div class="name">${s.name}</div><div class="stat">${s.attendancePct}% حضور</div></div>`);
  h += `</div><h3 style="margin-top:24px;">📝 أفضل الدرجات</h3><div class="hall-grid">`;
  byScore.forEach((s, i) => h += `<div class="hall-card"><div class="rank rank-${i+1}">#${i+1}</div><div class="name">${s.name}</div><div class="stat">${s.avgScore} متوسط</div></div>`);
  h += `</div><h3 style="margin-top:24px;">⭐ أكثر نقاط</h3><div class="hall-grid">`;
  byPoints.forEach((s, i) => h += `<div class="hall-card"><div class="rank rank-${i+1}">#${i+1}</div><div class="name">${s.name}</div><div class="stat">⭐ ${s.points||0} نقطة</div></div>`);
  h += `</div></div>`; m.innerHTML = h;
}

// ==================== REPORTS WITH EXCEL ====================
function loadReports() {
  const m = document.getElementById('main-content');
  const st = students(), att = attendance(), pay = payments(), ex = exams(), gr = groups();
  let h = `<div class="page"><h2>📊 التقارير</h2>`;
  if (gr.length > 0) { h += `<div class="chart-wrap"><h3>👥 توزيع الطلاب</h3><canvas id="groupChart" height="80"></canvas></div>`; setTimeout(() => { const ctx = document.getElementById('groupChart'); if (ctx) new Chart(ctx, { type: 'bar', data: { labels: gr.map(g => g.name), datasets: [{ label: 'الطلاب', data: gr.map(g => st.filter(s => s.groupId === g.id).length), backgroundColor: ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#3b82f6'] }] }, options: { responsive: true, plugins: { legend: { display: false } } } }); }, 200); }
  h += `<div class="act-bar">
    <button class="btn btn-excel" onclick="exportToExcel()">📥 تصدير Excel</button>
    <button class="btn btn-print" onclick="printReports()">🖨️ طباعة</button>
  </div>`;
  h += `<h3>📋 ملخص الطلاب</h3><table><tr><th>الطالب</th><th>المجموعة</th><th>حضور%</th><th>مدفوعات</th><th>متوسط</th><th>نقاط</th></tr>`;
  st.forEach(s => { const g = groupById(s.groupId), a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length; const pct = a.length ? Math.round((pr/a.length)*100) : 0, tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0); const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0; h += `<tr><td>${s.name}</td><td>${g?g.name:'—'}</td><td>${pct}%</td><td>${tot} ج.م</td><td>${avg}</td><td>⭐ ${s.points||0}</td></tr>`; });
  h += '</table></div>'; m.innerHTML = h;
}
function exportToExcel() {
  const st = students(), att = attendance(), pay = payments(), ex = exams(), gr = groups();
  const data = [['الاسم', 'الهاتف', 'المجموعة', 'حضور%', 'مدفوعات', 'متوسط', 'نقاط']];
  st.forEach(s => { const g = groupById(s.groupId), a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length; const pct = a.length ? Math.round((pr/a.length)*100) : 0, tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0); const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0; data.push([s.name, s.phone, g?g.name:'—', pct+'%', tot+' ج.م', avg, s.points||0]); });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
  XLSX.writeFile(wb, 'caeser_students_' + new Date().toISOString().slice(0,10) + '.xlsx');
  showToast('✅ تم تصدير Excel');
}
function printReports() { const st = students(), att = attendance(), pay = payments(), ex = exams(); let html = '<h2>تقرير</h2><table><tr><th>الطالب</th><th>حضور%</th><th>مدفوعات</th><th>متوسط</th></tr>'; st.forEach(s => { const a = att.filter(x => x.studentId === s.id), pr = a.filter(x => x.status === 'present').length; const pct = a.length ? Math.round((pr/a.length)*100) : 0, tot = pay.filter(x => x.studentId === s.id).reduce((sm,x) => sm + x.amount, 0); const exm = ex.filter(x => x.studentId === s.id), avg = exm.length ? (exm.reduce((sm,x)=>sm+x.score,0)/exm.length).toFixed(1) : 0; html += `<tr><td>${s.name}</td><td>${pct}%</td><td>${tot} ج.م</td><td>${avg}</td></tr>`; }); html += '</table>'; printDiv(html); }
</script>
